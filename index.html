<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탱크어붐 데이터 도감</title>
<meta name="description" content="Tank-a-Boom 탱크·부품·칩·스킨·모드 데이터">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e2f3d'/%3E%3Crect x='5' y='16' width='22' height='8' rx='2' fill='%23ffb43a'/%3E%3Crect x='10' y='10' width='11' height='7' rx='2' fill='%23ffb43a'/%3E%3Crect x='20' y='12' width='9' height='2.5' fill='%23ffb43a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#1e2f3d; --steel-2:#253a4b; --steel-3:#2f485c; --line:#3b566c;
  --ink:#e9eef2; --ink-2:#a9b9c6; --ink-3:#7890a3;
  --hazard:#f2c230; --hazard-ink:#1c1a12; --danger:#ff6b5b; --ok:#5fd39a;
  --r1:#9fb0bf; --r2:#4fa8ff; --r3:#bb83ff; --r4:#ffb43a;
  --display:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--steel)}
body{margin:0;background:var(--steel);color:var(--ink);font:15px/1.6 var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* 상단 */
header.top{position:sticky;top:0;z-index:20;background:rgba(30,47,61,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:56px}
.brand{font:22px/1 var(--display);letter-spacing:.5px;text-decoration:none;white-space:nowrap}
.maker{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(10,18,26,.45);font:500 14px/1 var(--body);color:var(--ink-3);white-space:nowrap;text-decoration:none}
.maker svg{flex:none}
.ver{font:600 12px/1 var(--body);color:var(--ink-3);white-space:nowrap;padding:5px 9px;border:1px solid var(--line);border-radius:6px}
.ver b{color:var(--ink);font-weight:700}
.bver{display:none}
.maker b{font:800 14px/1 var(--body);letter-spacing:.14em;color:var(--r4)}
.bar .sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang{flex:none}
.lang button{background:none;border:0;padding:4px 10px;cursor:pointer;color:var(--ink-3);white-space:nowrap}
.lshort{display:none}
.lang button[aria-pressed=true]{background:var(--steel-3);color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
nav.tabs a{flex:none;padding:9px 12px 11px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:500;font-size:14px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--hazard)}
nav.tabs a.warn{color:var(--hazard)}

main,main.wrap{padding-top:28px;padding-bottom:64px;min-height:70vh}
h1,h2,h3{margin:0;font-weight:400}
h1{font:clamp(30px,5vw,46px)/1.1 var(--display)}
h2{font:26px/1.2 var(--display);margin:40px 0 14px}
h3{font:700 16px/1.4 var(--body);margin:0 0 6px}
p{margin:0 0 10px}
.lead{color:var(--ink-2);max-width:68ch;margin-top:10px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.ph{font-style:normal;color:var(--hazard);background:rgba(242,194,48,.1);padding:0 4px;border-radius:3px;cursor:help}
.hl{color:#7fd4ff}
.unew{color:var(--hazard)} a[aria-current] .unew{color:inherit}
abbr.term{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}

/* 경고 테이프: 미공개 영역 전용 */
.tape{background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--hazard-ink) 14px 28px);height:10px;border-radius:2px}
.hazard-box{border:2px solid var(--hazard);border-radius:10px;background:linear-gradient(180deg,rgba(242,194,48,.08),transparent 60%);overflow:hidden}
.hazard-box .in{padding:18px 18px 20px}

/* 공통 블록 */
.panel{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:12px}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.r1{color:var(--r1);border-color:color-mix(in srgb,var(--r1) 50%,transparent)}
.pill.r2{color:var(--r2);border-color:color-mix(in srgb,var(--r2) 50%,transparent)}
.pill.r3{color:var(--r3);border-color:color-mix(in srgb,var(--r3) 50%,transparent)}
.pill.r4{color:var(--r4);border-color:color-mix(in srgb,var(--r4) 50%,transparent)}
.pill.st-upcoming,.pill.st-new,.pill.st-tutorial{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
.pill.st-new{background:transparent;color:var(--hazard)}
.pill.st-tutorial{background:transparent;color:var(--ink-2);border-color:var(--line)}
.pill.hid{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 14px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.filters select{background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%}
.count{color:var(--ink-3);font-size:13px;margin-left:auto}

/* 탱크 카드 */
.tcard{display:block;text-decoration:none;background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;border-top:3px solid var(--rc)}
.tcard:hover{background:var(--steel-3)}
.tcard .top{display:flex;gap:12px;align-items:center}
.tcard svg{flex:none}
.tcard .nm{font:21px/1.15 var(--display)}
.tcard .md{color:var(--ink-3);font-size:13px}
.tcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.tcard .stats b{display:block;font-size:16px}
.tcard .stats span{font-size:12px;color:var(--ink-3)}
.tcard .badges{margin-top:10px}

/* 상세 */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.dhead .nm{font:clamp(34px,6vw,54px)/1 var(--display)}
.dhead .sub{color:var(--ink-2);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:500}
.kv dt small{color:var(--ink-3)}
.stat{display:grid;grid-template-columns:minmax(90px,140px) 1fr 64px;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.stat .lab{color:var(--ink-2)}
.stat .v{text-align:right;font-weight:700}
.meter{height:8px;background:var(--steel);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--rc,var(--r2));border-radius:4px}
.lvl{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.lvl input{flex:1;accent-color:var(--hazard)}
.lvl output{font:22px/1 var(--display);min-width:68px}
.ability{border-left:3px solid var(--rc);padding:2px 0 2px 12px;margin-bottom:14px}
.ability .ttl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ability .ttl b{font-size:17px}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.slot .opt{padding:6px 0;border-top:1px dashed var(--line)}
.slot .opt:first-of-type{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--ink-3);font-weight:500;font-size:13px;position:sticky;top:0;background:var(--steel-2)}

.tbl th{white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.scroll{overflow:auto;max-width:100%}
.tbl.nw th,.tbl.nw td{white-space:nowrap}
.unused{opacity:.3}
.tbl td.nw,.tbl th.nw,.tbl td.n{white-space:nowrap}
.best{color:var(--ok);font-weight:700}
details summary{cursor:pointer;color:var(--ink-2)}
details[open] summary{margin-bottom:8px}
.crumbs{font-size:14px;color:var(--ink-3);margin-bottom:12px}
.crumbs a{color:var(--ink-2)}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
code,.mono{font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--ink-2);word-break:break-all}

/* 홈 */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:end}
.lineup{display:flex;align-items:flex-end;gap:2px;overflow:hidden;height:120px;mask-image:linear-gradient(90deg,#000 70%,transparent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:24px}
.facts a{background:var(--steel-2);padding:14px 16px;text-decoration:none}
.facts a:hover{background:var(--steel-3)}
.facts b{font:28px/1 var(--display);display:block}
.facts span{color:var(--ink-2);font-size:13px}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.up a{display:block;text-decoration:none;background:rgba(0,0,0,.18);border-radius:8px;padding:12px}
.up a:hover{background:rgba(0,0,0,.3)}
.upshot{height:120px;margin-bottom:8px}
.upshot .stage{height:100%}
.upshot .shot{padding:6px}

/* 이미지 */
.shot{display:block;width:100%;height:100%;object-fit:contain}
.stage{position:relative;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%),var(--steel);border-radius:8px;overflow:hidden}
.tcard .stage{height:150px;margin:-2px -2px 10px}
.tcard .stage img{padding:8px 10px 2px}
.dhead .stage{width:min(460px,100%);aspect-ratio:4/3}
.dhead .stage img{padding:14px}
.ico{flex:none;object-fit:contain;border-radius:6px}
.ability .ttl .ico{width:40px;height:40px;align-self:center}
.panel .ico.lg{width:64px;height:64px;float:right;margin:0 0 6px 10px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skin{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;cursor:zoom-in;font:inherit;color:inherit}
.skin:hover{border-color:var(--ink-3)}
.skin .stage{aspect-ratio:1;margin-bottom:6px}
.skin b{display:block;font-size:14px;line-height:1.3}
.skin span{font-size:12px;color:var(--ink-3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumb{background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:zoom-in;font:inherit;color:inherit;text-align:left}
.thumb img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:var(--steel);border-radius:5px}
.thumb span{display:block;font-size:11.5px;line-height:1.3;margin-top:4px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapcard{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--steel)}
.mapcard .in{padding:10px 12px}
.op-av{width:100%;max-height:340px;object-fit:contain;object-position:bottom;display:block;margin-bottom:8px}
dialog.lb{border:1px solid var(--line);background:var(--steel-2);color:var(--ink);border-radius:12px;padding:14px;max-width:min(92vw,820px)}
dialog.lb::backdrop{background:rgba(8,14,20,.78)}
dialog.lb img{max-width:100%;max-height:72vh;display:block;margin:0 auto}
dialog.lb p{margin:10px 0 0;text-align:center}
dialog.lb button{position:absolute;top:8px;right:10px;background:var(--steel-3);border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
b.val{color:var(--ok);font-weight:700}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.bgrid .panel{min-width:0}
.ctl{margin-bottom:12px}
.ctl>label,.ctl>.lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.ctl select{width:100%;background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.ctl .note{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.chiplist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.chiplist label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
.chiplist label:last-child{border-bottom:0}
.chiplist input{margin-top:3px;accent-color:var(--hazard)}
.up-g{color:var(--ok)} .dn-r{color:var(--danger)}
.btn{background:var(--hazard);color:var(--hazard-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.sticky{position:sticky;top:110px}
@media (max-width:860px){.bgrid{grid-template-columns:1fr}.sticky{position:static}}
/* 탱크 상세 바로가기 */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}
.toc button{font:inherit;font-size:13px;color:var(--ink-2);background:var(--steel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.toc button:hover{color:var(--ink);border-color:var(--hazard)}
main h2,#sec-top{scroll-margin-top:120px}
/* 세부 수치 */
details.vals{margin-top:6px}
details.vals summary{cursor:pointer;color:var(--ink-3);font-size:13px}
details.vals table{margin-top:6px;border-collapse:collapse}
details.vals.sub{margin-top:8px}
details.vals td{font-size:13px;padding:3px 12px 3px 0;vertical-align:top}
details.vals td code{color:var(--ink-3);font-size:11.5px}
/* 통합 검색 */
.findbtn{color:var(--ink-2);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.findbtn:hover{color:var(--ink);border-color:var(--hazard)}
.hits{display:grid;gap:8px}
.hit{display:flex;gap:10px;align-items:flex-start;text-decoration:none;background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.hit:hover{border-color:var(--hazard)}
.hit .k{flex:none;font-size:12px;color:var(--ink-3);width:64px;padding-top:2px}
.hit .b{min-width:0}
/* 모바일 탱크 목록: 2열 작은 카드 */
@media (max-width:600px){
  .bar .ver{display:none}
  .brand{display:flex;flex-direction:column;justify-content:center;gap:3px}
  .brand .bt{overflow:hidden;text-overflow:ellipsis}
  .brand .bver:not([hidden]){display:block;font:600 10.5px/1 var(--body);letter-spacing:.02em;color:var(--ink-3)}
  .g-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .g-cards .tcard{padding:8px}
  .g-cards .tcard .stage{height:86px;margin:-2px -2px 6px}
  .g-cards .tcard .stage img{padding:4px}
  .g-cards .tcard .nm{font-size:15.5px}
  .g-cards .tcard .md{font-size:11px}
  .g-cards .tcard .badges{display:none}
  .g-cards .tcard .stats{gap:2px;margin-top:6px;padding-top:6px}
  .g-cards .tcard .stats b{font-size:13px}
  .g-cards .tcard .stats span{font-size:10.5px}
  .findbtn{padding:3px 8px;font-size:12px}
}
td img.cell{width:44px;height:44px;object-fit:contain;vertical-align:middle;background:var(--steel);border-radius:4px}


@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .dhead{grid-template-columns:1fr}
  .dhead svg{width:150px;height:auto}
  .stat{grid-template-columns:96px 1fr 58px}
  .bar{gap:7px}
  .brand{font-size:16px;letter-spacing:0}
  .maker{padding:4px 8px 4px 7px;font-size:11px;gap:4px}
  .maker svg{width:14px;height:14px}
  .maker b{font-size:11px;letter-spacing:.08em}
  .lang button{padding:4px 6px;font-size:12.5px}
  .lfull{display:none} .lshort{display:inline}
  .brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
}
@media (prefers-reduced-motion:no-preference){
  .lineup span{animation:roll .7s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes roll{from{transform:translateX(-40px);opacity:0}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#"><span class="bt">탱크어붐 데이터 도감</span><span class="bver" id="bver" hidden></span></a>
      <span class="maker" aria-label="MAMMON 제작"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--r4)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l4.5 4L12 5l4.5 6L21 7l-2 11H5z"/></svg>by <b>MAMMON</b></span>
      <span class="ver" id="ver" hidden></span>
      <span class="sp"></span>
      <a class="findbtn" href="#find" aria-label="통합 검색">검색</a>
      <div class="lang" role="group" aria-label="이름 표기 언어">
        <button type="button" data-lang="ko" aria-pressed="true"><span class="lfull">한국어</span><span class="lshort">KO</span></button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <a href="#tanks">탱크</a>
      <a href="#build">빌드 시뮬레이터</a>
      <a href="#compare">비교</a>
      <a href="#skills">스킬·특성</a>
      <a href="#parts">부품</a>
      <a href="#chips">칩</a>
      <a href="#operators">오퍼레이터</a>
      <a href="#skins">스킨</a>
      <a href="#modes">모드·맵</a>
      <a href="#growth">성장·보상</a>
      <a href="#score">점수·MVP</a>
      <a href="#hidden" class="warn">미공개·출시 예정</a>
      <a href="#gallery">이미지</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<dialog class="lb" id="lb"><button type="button" id="lbx">닫기</button><img id="lbimg" alt=""><p id="lbcap"></p></dialog>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DB;
// 머리글의 게임 데이터 버전(11-08 요청). data.js의 build에서 읽어 업데이트 때 저절로 바뀐다.
{ const v = document.getElementById("ver"), b = D.build || {};
  if (v && b.version) { v.innerHTML = `게임 데이터 <b>v${b.version}</b>`; v.title = `게임 ${b.version} (빌드 ${b.build || "?"}) 데이터 기준`; v.hidden = false; }

function spark(pts, w=260, h=64) {
  if (!pts || pts.length < 2) return "";
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);

const VW = {Damage:"피해",Increase:"증가",Decrease:"감소",Ratio:"비율",Range:"거리",Distance:"거리",Radius:"반경",Duration:"지속",Time:"시간",Delay:"지연",
  Cooldown:"재사용",Reload:"재장전",Clip:"",Element:"원소",Heal:"회복",Armor:"장갑",Energy:"에너지",Speed:"속도",Max:"최대",Min:"최소",Count:"횟수",Num:"개수",
  Bomb:"폭탄",Extra:"추가",Bombing:"광역 폭발",Health:"체력",Height:"높이",Shield:"보호막",Charge:"충전",Shot:"사격",Shell:"포탄",Rocket:"로켓",Missile:"미사일",
  Selection:"선택",Explode:"폭발",Explosion:"폭발",Warning:"경고",Buff:"버프",Limit:"제한",Fov:"시야각",Target:"목표",Projectile:"포탄",Change:"전환",Value:"값"};
function dispLabel(k) {
  const w = k.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[._]/g, " ").split(/\s+/).filter(Boolean);
  const ko = w.map(x => VW[x] ?? null);
  return ko.every(x => x !== null) ? ko.filter(Boolean).join(" ") : "";
}
function dispVal(k, v, u) {
  const UNIT = {"m": x => num(x / 100, 1) + "m", "m/s": x => num(x / 100, 1) + "m/s", "m/s²": x => num(x / 100, 1) + "m/s²",
    "%": x => num(x * 100, 1) + "%", "%p": x => num(x, 1) + "%", "초": x => num(x, 2) + "초", "°": x => num(x, 1) + "°", "°/s": x => num(x, 1) + "°/s",
    "x": x => "×" + num(x, 2), "": x => num(x, 2)};
  const one = u !== undefined ? (UNIT[u] || (x => num(x, 2) + u)) : x => {
    if (/Range|Distance|Radius|Height/.test(k) && Math.abs(x) >= 100) return num(x / 100, 1) + "m";
    if (/Ratio|Factor|Chance|Multiplier/.test(k) && Math.abs(x) <= 5) return num(x * 100, 1) + "%";
    if (/Increase|Decrease|Reduce|Rate/.test(k) && !/Time|Speed|Num|Count/.test(k) && Math.abs(x) <= 1) return num(x * 100, 1) + "%";
    if (/Duration|Time|Delay|Cooldown|Interval/.test(k)) return num(x, 2) + "초";
    return num(x, 2);
  };
  return Array.isArray(v) ? one(v[0]) + " ~ " + one(v[1]) : one(v);
}
function dispTable(list) {
  if (!list || !list.length) return "";
  // 한글 이름이 있는 값을 먼저 보이고, 번역 안 된 값은 안쪽에 접어 둔다(원래 이름을 띄어 써서 표시)
  const row = (l, [k, v, , u]) => `<tr><td>${l}</td><td><b>${dispVal(k, v, u)}</b></td></tr>`;
  const lab = e => e[2] || dispLabel(e[0]);
  const ko = list.filter(e => lab(e)), en = list.filter(e => !lab(e));
  const enT = en.length ? `<details class="vals sub"><summary>번역 안 된 항목 ${en.length}개 (원래 이름)</summary><table>${en.map(e => row(`<span class="small muted">${esc(e[0].replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[._]/g, " "))}</span>`, e)).join("")}</table></details>` : "";
  return `<details class="vals"><summary>세부 수치 ${list.length}개 (게임 데이터)</summary>${ko.length ? `<table>${ko.map(e => row(esc(lab(e)), e)).join("")}</table>` : ""}${enT}</details>`;
}
function meterRow(lab, val, max, unit="", invert=false, tip="") {
  const pct = max ? Math.max(3, Math.min(100, (invert ? (max / (val || max)) * 40 : val / max * 100))) : 0;

}

  const collect = () => {

      if (f.length) { fx.push(...f); applied.push(`${strip(L(pt.name))}: ${f.map(x => fxLabel(x)).join(", ")}`); }

    st.chips.forEach(cid => { const c = D.chips[cid]; if (!c) return; const f = fxOf(c, st.mode);

    addCond("t", t.id, "특성 " + strip(L(t.trait.name)));
    return {fx, applied, notq, cond};
  };
  const baseFx = () => { const fx = []; t.enh.filter(e => e.lv <= st.enh).forEach(e => fx.push(...e.mod.fx));
    if (st.tech) D.tech.filter(x => x.manu === t.manu).forEach(x => { const l = x.levels[x.levels.length - 1]; if (l?.mod?.fx) fx.push(...l.mod.fx); }); return fx; };
  const draw = () => {

    const s = applyFx(baseStats(t, st.lv), fx);

    $("#bstats").innerHTML = `<tr><th>능력치</th><th class="n">기본</th><th class="n">빌드</th><th class="n">변화</th></tr>` + STATROWS.map(([k, lab, dir, d]) => {
      const a = b0[k], v = s[k]; if (a == null || v == null || (!a && !v && k.startsWith("f"))) return "";
      const diff = v - a, good = dir * diff > 1e-9, bad = dir * diff < -1e-9;
      const pct = a ? ` (${diff > 0 ? "+" : ""}${num(diff / Math.abs(a) * 100, 1)}%)` : "";
      return `<tr><td>${lab}</td><td class="n">${fmt(a, d)}</td><td class="n"><b>${fmt(v, d)}</b></td><td class="n ${good ? "up-g" : bad ? "dn-r" : "muted"}">${Math.abs(diff) > 1e-9 ? (diff > 0 ? "+" : "") + fmt(diff, d) + (d === "%" ? "" : pct) : "–"}</td></tr>`; }).join("");
    $("#bfx").innerHTML = applied.length ? applied.map(x => `<div>${x}</div>`).join("") : '<span class="muted">없음</span>';

  };
  const best = () => {
    const pc = p => [...fxOf(D.parts[p], st.mode), ...(st.condAll ? condOf(t, "p", p) : condOf(t, "p", p).filter((x, i) => st.cond[`p:${p}:${i}`]))];
    const cc = c => [...fxOf(D.chips[c], st.mode), ...(st.condAll ? condOf(t, "c", c) : condOf(t, "c", c).filter((x, i) => st.cond[`c:${c}:${i}`]))];
    const traitFx = (st.condAll ? condOf(t, "t") : condOf(t, "t").filter((x, i) => st.cond[`t:${t.id}:${i}`]));
    const bfx = [...baseFx(), ...traitFx], chipFx = st.chips.flatMap(cc);
    const b0 = applyFx(baseStats(t, st.lv), bfx); let res = [];
    const rec = (i, picked) => {
      if (i === t.slots.length) {
        const s = applyFx(baseStats(t, st.lv), [...bfx, ...chipFx, ...picked.flatMap(pc)]);
        res.push({picked: [...picked], score: scoreOf(s, b0, st.obj), s}); return; }
      for (const p of t.slots[i]) { if (picked.includes(p)) continue; picked.push(p); rec(i + 1, picked); picked.pop(); }
    };
    rec(0, []);
    res.sort((a, b) => b.score - a.score);
    if (!res.length) return;
    st.slots = res[0].picked;
    if (st.condAll) { st.slots.forEach(p => condOf(t, "p", p).forEach((x, i) => st.cond[`p:${p}:${i}`] = true)); condOf(t, "t").forEach((x, i) => st.cond[`t:${t.id}:${i}`] = true); }
    t.slots.forEach((s, i) => { $("#bs" + i).value = st.slots[i]; });

    // 칩 추천: 현재 부품 기준, 칩 1개 추가 시 점수 상승 순
    const cur = applyFx(baseStats(t, st.lv), [...bfx, ...chipFx, ...st.slots.flatMap(pc)]);
    const chipRank = t.chips.map(c => D.chips[c]).filter(c => c && (c.fx?.length || (st.condAll && c.cfx?.length)) && !st.chips.includes(c.id)).map(c => ({c, d: scoreOf(applyFx(baseStats(t, st.lv), [...bfx, ...chipFx, ...st.slots.flatMap(pc), ...cc(c.id)]), b0, st.obj) - scoreOf(cur, b0, st.obj)})).filter(x => x.d > 1e-9).sort((a, b) => b.d - a.d).slice(0, 6);

      ${chipRank.length ? `<p style="margin:8px 0 4px"><b>추천 칩</b></p><div class="row">${chipRank.map(x => `<span class="pill ${chipCls(x.c.rarity)}">${L(x.c.name)}</span>`).join("")}</div>` : ""}`;
    draw();
  };

}
function fxLabel(x) {
  const nm = D.modifiers[x.m] ? strip(L(D.modifiers[x.m].name)) || x.m : x.m;
  const v = x.r ? `${x.r > 0 ? "+" : ""}${num(x.r * 100, 1)}%` : (FACT.has(x.m) ? `${x.a > 0 ? "+" : ""}${num(x.a * 100, 1)}%` : `${x.a > 0 ? "+" : ""}${num(x.a, 1)}`);
  if (x.m === "DamageReduction") return `받는 피해 ${x.a > 0 ? "−" : "+"}${num(Math.abs(x.a) * 100, 1)}%`;
  if (x.m === "ClipReloadTime" && !x.r && x.a) return `${nm} ${x.a > 0 ? "+" : ""}${num(x.a, 2)}초`;
  return `${nm} ${v}${x.kind === "active" ? ` (${num(x.dur)}초/쿨 ${num(x.cd)}초${x.w != null && x.w !== 1 ? `, 가동률 ${num(x.w * 100, 0)}%` : ""})` : ""}`;
}
const FACT = new Set(["CritChance","CritDamageMultiplier","MainGunDamageFactor","AbilityDamageFactor","SummonDamageFactor","RamDamageFactor","DamageToAIFactor"]);

// ---------- 비교 ----------
function compare(ids) {
  let sel = (ids || "").split(",").map(Number).filter(i => TANK[i]);
  if (!sel.length) sel = [20006, 20018, 20007];
  while (sel.length < 2) sel.push(D.tanks.find(t => !sel.includes(t.id)).id);
  let lv = MAXLV;
  const options = cur => D.tanks.map(t => `<option value="${t.id}" ${t.id===cur?"selected":""}>${strip(tname(t))} (${esc(t.model)})</option>`).join("");
  const ROWS = [
    ["내구도", t => lvRow(t,lv).hp, 1], ["장갑", t => lvRow(t,lv).ar, 1], ["기본 피해", t => lvRow(t,lv).dmg, 1], ["추정 DPS", t => Math.round(dps(t,lv)), 1],
    ["재장전(초)", t => t.fire.ClipReloadTime, -1], ["탄창", t => t.fire.MagazineCapacity, 1], ["기본 분산", t => t.fire.Dispersion, -1],
    ["조준 수렴", t => t.fire.AimingSpeedFactor, 1], ["이동 중 분산", t => t.fire.ChassisMoveDispersionFactor, -1], ["포탑 회전(°/s)", t => t.fire.TurretRotationSpeed, 1],
    ["최대 피해 거리(m)", t => t.fire.FullDamageRange/100, 1], ["포탄 초속(m/s)", t => (t.proj?.InitialSpeed||0)/100, 1], ["치명타 배율", t => t.proj?.CritDamageMultiplier, 1],
    ["초치명 확률(%)", t => (t.proj?.SuperCritChance||0)*100, 1], ["타격당 에너지", t => t.energy.EnergyPerHit, 1], ["초당 에너지", t => t.energy.EnergyPerSecond, 1],
    ["파워 무브 비용", t => t.energy.AbilityEnergyCost, -1], ["질량(kg)", t => t.move.OverrideVehicleMass, 0], ["선회(°/s)", t => t.move.SteeringAngularSpeed, 1],
    ["충돌 강도", t => t.energy && t.body.RammingStrength, 1],
  ];
  const draw = () => {
    const ts = sel.map(i => TANK[i]);
    $("#cmp").innerHTML = `<table class="tbl"><tr><th></th>${ts.map(t => `<th style="color:${RC[t.rarity]}">${t.imgS ? `<div style="width:110px;height:110px">${IMG(t.imgS, tname(t), "shot")}</div>` : ""}<a href="#t/${t.id}">${tname(t)}</a><div class="small muted">${rolename(t.role)} · ${typename(t.type)}</div></th>`).join("")}</tr>
      <tr><td class="muted nw">파워 무브</td>${ts.map(t => `<td>${L(t.skill.name)}</td>`).join("")}</tr>
      <tr><td class="muted nw">고유 특성</td>${ts.map(t => `<td>${L(t.trait.name)}</td>`).join("")}</tr>
      ${ROWS.map(([lab, f, dir]) => { const vs = ts.map(f); const best = dir ? (dir > 0 ? Math.max(...vs.filter(v=>v!=null)) : Math.min(...vs.filter(v=>v!=null))) : null;
        return `<tr><td class="muted nw">${lab}</td>${vs.map(v => `<td class="${dir && v === best && new Set(vs).size > 1 ? "best" : ""}">${num(v)}</td>`).join("")}</tr>`; }).join("")}</table>`;
    history.replaceState(null, "", "#compare/" + sel.join(","));
  };
  app.innerHTML = `<h1>탱크 비교</h1>
  <div class="filters" id="pick">${sel.map((id, i) => `<select data-i="${i}" aria-label="탱크 ${i+1}">${options(id)}</select>`).join("")}
    ${sel.length < 4 ? `<button type="button" id="add" class="pill" style="cursor:pointer;background:none;padding:6px 12px">탱크 추가</button>` : ""}
    <label class="row small">레벨 <input type="range" id="clv" min="1" max="${MAXLV}" value="${lv}" style="accent-color:var(--hazard)"> <output id="clvo">${lv}</output></label></div>
  <div class="panel scroll" id="cmp"></div>`;

  $("#add")?.addEventListener("click", () => { sel.push(D.tanks.find(t => !sel.includes(t.id)).id); compare(sel.join(",")); });

// ---------- 부품 ----------
function partGroup(p) {
  const k = p.key || "";
  let m = k.match(/LOC_MODIFY_(\d{5})_/); if (m) return "t" + m[1];
  if (/LOC_Gear/i.test(k)) return "gear";
  m = k.match(/LOC_MODIFY_([A-Z]+)_/); if (m) return "m" + m[1];
  return "etc";
}
function parts() {
  const groups = {};
  Object.values(D.parts).forEach(p => (groups[partGroup(p)] ||= []).push(p));
  const gname = g => g === "gear" ? "공용 장비(기어)" : g === "etc" ? "기타" : g[0] === "t" ? (TANK[g.slice(1)] ? strip(tname(TANK[g.slice(1)])) + " 전용" : g.slice(1)) : (D.manu[g.slice(1)] ? strip(manuname(g.slice(1))) + " 제조사" : g.slice(1));
  const order = Object.keys(groups).sort((a,b) => (a==="gear"?-1:0) - (b==="gear"?-1:0) || a.localeCompare(b));
  app.innerHTML = `<h1>부품</h1>
  <div class="filters"><input type="search" id="q" placeholder="부품 이름·효과 검색" aria-label="검색"><select id="tk" aria-label="탱크"><option value="">탱크: 전체</option>${D.tanks.filter(t => (t.slots || []).some(sl => sl.length)).slice().sort((a, b) => strip(tname(a)).localeCompare(strip(tname(b)), "ko")).map(t => `<option value="${t.id}">${esc(strip(tname(t)))}</option>`).join("")}</select><select id="g" aria-label="분류"><option value="">분류: 전체</option>${order.map(g => `<option value="${g}">${esc(gname(g))}</option>`).join("")}</select><span class="count" id="cnt"></span></div><div id="list"></div>`;
  const draw = () => {
    const q = $("#q").value.trim().toLowerCase(), gs = $("#g").value, tk = $("#tk").value; let n = 0;
    // 탱크를 고르면 그 탱크 장착 칸에 들어 있는 부품 전부(전용 + 제조사 공용 + 공용 장비)
    const can = tk && TANK[tk] ? new Set(TANK[tk].slots.flat().map(String)) : null;
    $("#list").innerHTML = order.filter(g => !gs || g === gs).map(g => {
      const hit = groups[g].filter(p => (!can || can.has(String(p.id))) && (!q || strip(L(p.name) + " " + L(p.desc)).toLowerCase().includes(q)));
      // 탱크마다 따로 들어 있는 같은 부품(이름·설명·비용이 같음)은 한 장으로 합친다
      const uniq = new Map();
      hit.forEach(p => { const k = L(p.name) + "|" + L(p.desc) + "|" + JSON.stringify(p.cost); const u = uniq.get(k); u ? u.n++ : uniq.set(k, {p, n: 1}); });
      const items = [...uniq.values()]; n += items.length;
      if (!items.length) return "";
      return `<h2 style="font-size:21px">${esc(gname(g))} <span class="small muted">${items.length}</span></h2><div class="grid g-3">${items.map(({p, n: c}) => `<div class="panel">${IMG(p.icon, L(p.name), "ico lg")}<h3>${L(p.name) || `<span class="muted">${esc(p.key)}</span>`}</h3><p class="small">${L(p.desc)}</p><p class="small muted" style="margin:0">${costs(p.cost)}${c > 1 ? ` · 같은 부품 ${c}개` : ""}</p></div>`).join("")}</div>`;
    }).join("") || '<div class="empty">결과 없음</div>';
    $("#cnt").textContent = n + "개";
  };
  $("#q").addEventListener("input", draw); $("#g").addEventListener("input", draw); $("#tk").addEventListener("input", draw); draw();
}

// ---------- 미공개 ----------
const UTABS = [["tanks","탱크"],["modes","모드"],["maps","맵"],["skins","스킨"],["parts","부품"],["chips","칩"],["etc","기타"]];
const UGROUP = {tanks: {upcoming: "출시 예정", tutorial: "튜토리얼 전용"},
  modes: {dev: "개발 중 신규 모드", variant: "내부 변형(칩·저중력)", test: "테스트 설정"},
  maps: {dev: "신규 모드용 맵", variant: "변형(이름 미번역)", test: "테스트 맵"}};
const UWHY = {hidden: "게임 안 숨김", upcoming: "출시 예정 탱크용", unused: "장착 탱크 없음", untranslated: "이름 미번역", locOnly: "문구만 존재"};
let UNEW = false;   // 이번 업데이트 신규만 보기
function hidden(tab) {
  const U = D.unreleased, H = D.hidden, C = U.cats;
  tab = UTABS.some(([k]) => k === tab) ? tab : "tanks";
  const isNew = x => x.since === U.latest;
  const since = x => isNew(x) ? `<span class="pill st-new">${esc(U.latest)} 신규</span>` : "";
  const why = x => (x.why || []).map(r => `<span class="pill${r === "hidden" ? " hid" : ""}">${UWHY[r] || esc(r)}</span>`).join("");
  const items = k => (C[k] || []).filter(x => !UNEW || isNew(x));
  const grouped = (k, card, grid) => Object.entries(UGROUP[k]).map(([g, lab]) => {
    const xs = items(k).filter(x => x.g === g);
    return xs.length ? `<h2 style="font-size:20px">${lab} <span class="small muted">${xs.length}</span></h2><div class="grid ${grid}">${xs.map(card).join("")}</div>` : "";
  }).join("");
  const tankCard = x => { const t = TANK[x.id]; return `<a class="tcard" href="#t/${t.id}" style="--rc:${RC[t.rarity]}">${t.img ? tankShot(t) : ""}<div class="top">${t.img ? "" : tankSvg(t, 74)}<div><div class="nm">${tname(t)}</div><div class="md">${esc(t.model)} · ${typename(t.type)} · ${manuname(t.manu)}</div></div></div>
    <div class="row badges">${stPill(t)}${rPill(t.rarity)}<span class="pill">${rolename(t.role)}</span>${since(x)}</div>
    <p class="small" style="margin:8px 0 0">${L(t.skill.name) ? `파워 무브 <b>${L(t.skill.name)}</b>` : ""}${L(t.trait.name) ? ` · 특성 <b>${L(t.trait.name)}</b>` : ""}</p>
    <p class="small muted" style="margin:4px 0 0">${t.why.map(esc).join(", ")} · Lv${MAXLV} 내구도 ${num(lvRow(t,MAXLV).hp)} / 피해 ${num(lvRow(t,MAXLV).dmg)}</p></a>`; };
  const modeCard = x => { const m = D.modes.find(y => y.id === x.id); return `<section class="panel">${m.bg ? `<img src="img/${encodeURIComponent(m.bg)}.webp" alt="" loading="lazy" style="width:100%;aspect-ratio:21/9;object-fit:cover;border-radius:6px;margin-bottom:10px;display:block">` : ""}
    <div class="row" style="justify-content:space-between"><h3 style="margin:0" class="row">${IMG(m.icon, L(m.name), "ico", 'width="32" height="32"')}${L(m.name) || esc(m.type)}</h3>${since(x)}</div>
    <p class="small muted mono" style="margin:6px 0 0">${esc(m.type)} · 설정 ${m.id}${m.cls ? " · " + esc(m.cls) : ""}</p>${(m.desc || []).map(d => `<p class="small">${L(d)}</p>`).join("")}</section>`; };
  const mapCard = x => { const m = D.maps.find(y => y.id === x.id), cap = strip(L(m.name) || m.path); return `<div class="mapcard">${m.bg ? `<img src="img/${encodeURIComponent(m.bg)}.webp" alt="${esc(cap)}" loading="lazy" data-zoom="${esc(m.bg)}" data-cap="${esc(cap)}" style="cursor:zoom-in">` : ""}
    <div class="in"><div class="row" style="justify-content:space-between"><b>${L(m.name) || esc(m.path)}</b>${m.mini ? `<button type="button" class="pill" style="cursor:zoom-in;background:none" data-zoom="${esc(m.mini)}" data-cap="${esc(cap)} 미니맵">미니맵</button>` : ""}</div>
    <div class="small muted">${m.id} · <span class="mono">${esc(m.path)}</span></div><div class="row" style="margin-top:4px">${m.disabled ? '<span class="pill hid">비활성</span>' : ""}${since(x)}</div></div></div>`; };
  const skinItem = x => { const sk = D.skins[x.id], t = TANK[sk.tank]; return `<div>${skinCard(sk)}<div class="row small" style="margin-top:4px;gap:4px">${t ? `<a href="#t/${t.id}">${tname(t)}</a>` : ""}${why(x)}${since(x)}</div></div>`; };
  const partItem = x => { const p = D.parts[x.id]; return `<div class="panel">${IMG(p.icon, L(p.name), "ico lg")}<h3>${L(p.name) || `<span class="muted">${esc(p.key)}</span>`}</h3><p class="small">${L(p.desc)}</p>
    <div class="row small" style="gap:4px">${why(x)}${since(x)}</div>${x.tanks.length ? `<p class="small muted" style="margin:6px 0 0">장착: ${x.tanks.map(id => `<a href="#t/${id}">${tname(TANK[id])}</a>`).join(", ")}</p>` : ""}</div>`; };
  const chipItem = x => { const c = D.chips[x.id]; return `<div class="panel"><h3><a href="#chips/${x.id}">${L(c.name) || x.id}</a></h3><p class="small">${L(c.desc)}</p><div class="row small" style="gap:4px">${why(x)}${since(x)}</div></div>`; };
  const flat = (k, card, grid) => { const xs = items(k); return xs.length ? `<div class="${grid === "skins" ? "skins" : "grid " + grid}">${xs.map(card).join("")}</div>` : ""; };
  const etc = () => `<div class="grid g-2">
    <div class="panel"><h3>제조사 ‘스피어’</h3><p class="small">EManufacturerType::SPHERE · 평판 테이블·소속 탱크 없음</p></div>
    <div class="panel"><h3>미사용 무기 유형</h3><p class="small">${H.unusedWeaponTypes.map(esc).join(", ") || "없음"}</p></div>
    <div class="panel"><h3>미구현 메달 ${H.locOnlyMedals.length}개</h3><p class="small"><a href="#growth">메달 보기</a></p></div>
    <div class="panel"><h3>프리즘 등급 칩 ${H.prismaticChips.length}개</h3><p class="small">${H.prismaticChips.map(c => `<a href="#chips/${c}">${L(D.chips[c].name) || c}</a>`).join(", ") || "없음"}</p></div>
  </div>
  <h2>미번역 문구 <span class="small muted">${Object.values(H.untranslated).reduce((a,b)=>a+b.length,0)}개</span></h2>
  ${Object.entries(H.untranslated).sort((a,b) => b[1].length - a[1].length).map(([g, xs]) => `<details class="panel" style="margin-bottom:8px"><summary><b>${esc(g)}</b> <span class="muted">${xs.length}</span></summary><table class="tbl">${xs.map(x => `<tr><td class="mono" style="width:40%">${esc(x.k)}</td><td class="small">${x.en}</td></tr>`).join("")}</table></details>`).join("")}`;
  const body = {tanks: () => grouped("tanks", tankCard, "g-2"), modes: () => grouped("modes", modeCard, "g-2"), maps: () => grouped("maps", mapCard, "g-3"),
    skins: () => flat("skins", skinItem, "skins"), parts: () => flat("parts", partItem, "g-3"), chips: () => flat("chips", chipItem, "g-3"), etc}[tab]();
  const cnt = k => { if (k === "etc") return ""; const n = C[k].length, nn = C[k].filter(isNew).length; return ` <span class="muted">${n}</span>${nn ? ` <b class="unew">+${nn}</b>` : ""}`; };
  app.innerHTML = `<h1>미공개·출시 예정</h1>
  <nav class="row" style="margin:16px 0 10px;gap:6px" aria-label="미공개 분류">${UTABS.map(([k, lab]) => `<a class="pill" href="#hidden/${k}" style="text-decoration:none;padding:4px 12px;${k === tab ? "background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)" : ""}"${k === tab ? ' aria-current="true"' : ""}>${lab}${cnt(k)}</a>`).join("")}</nav>
  ${tab === "etc" ? "" : `<label class="row small" style="gap:6px;margin-bottom:12px;cursor:pointer"><input type="checkbox" id="unew" ${UNEW ? "checked" : ""}>${esc(U.latest)} 업데이트에서 새로 생긴 것만</label>`}
  <div class="hazard-box"><div class="tape"></div><div class="in">${body || '<div class="empty">해당 항목 없음</div>'}</div></div>`;
  $("#unew")?.addEventListener("change", e => { UNEW = e.target.checked; hidden(tab); });
}

// ---------- 이미지 갤러리 ----------
let GAL = null;
function gallery(group) {
  const groups = D.gallery.filter(g => g[2]);
  group = group || groups[0][0];
  app.innerHTML = `<h1>이미지</h1>
  <nav class="row" style="margin:16px 0" aria-label="이미지 분류">${groups.map(([g, lab, n]) => `<a class="pill" href="#gallery/${g}" style="text-decoration:none;padding:4px 12px;${g === group ? "background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)" : ""}">${esc(lab)} ${n}</a>`).join("")}</nav>
  <div class="filters"><input type="search" id="q" placeholder="이름 검색" aria-label="이미지 검색"><span class="count" id="cnt"></span></div><div class="thumbs" id="list"><div class="empty">불러오는 중…</div></div>`;
  const draw = () => {
    const q = $("#q").value.trim().toLowerCase();
    const ls = (GAL[group] || []).filter(([n, c]) => !q || (n + " " + strip(L(c))).toLowerCase().includes(q));
    $("#cnt").textContent = ls.length + "장";
    $("#list").innerHTML = ls.map(([n, c]) => { const cap = strip(L(c)) || n.replace(/^T_(UI_|HQ_|common_|callingcard_)?/i, "").replace(/_/g, " "); return `<button type="button" class="thumb" data-zoom="${esc(n)}" data-cap="${esc(cap)}"><img src="img/${encodeURIComponent(n)}.webp" alt="${esc(cap)}" loading="lazy" decoding="async"><span>${esc(cap)}</span></button>`; }).join("") || '<div class="empty">결과 없음</div>';
  };
  const go = () => { $("#q").addEventListener("input", draw); draw(); };
  if (GAL) return go();
  fetch("gallery.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => { GAL = j; go(); })
    .catch(() => { $("#list").innerHTML = '<div class="empty">이미지 목록을 불러오지 못했습니다. 새로고침해 보세요.</div>'; });
}

// ---------- 점수·MVP ----------
function score() {
  const F = Object.values(D.scoreFactors || {});
  const COLS = [["kill_factor", "처치"], ["assist_kill_factor", "도움"], ["death_factor", "사망(−)"], ["capture_factor", "점령"], ["capture_time_factor", "점령 유지"],
    ["beacon_factor", "신호기"], ["bounty_factor", "현상금"], ["flag_capture_factor", "깃발"], ["payload_capture_factor", "화물 점령"], ["payload_time_factor", "화물 이동"], ["sentry_takedown_factor", "파수꾼"]];
  const MODE = {"TDM": "팀 데스매치", "Domination": "점령", "Kill Confirm": "킬 컨펌", "Bounty Hunter": "현상금 사냥", "Flag Strike": "플래그 스트라이크", "Payload": "화물 호송",
    "Free-for-All": "개인전", "Flag Heist": "깃발 탈취", "Sentry Takedown": "파수꾼 격파"};
  const medals = (D.medals || []).filter(m => m.score).sort((a, b) => b.score - a.score);
  // 모드마다 실제로 쓰이는 목표물 칸(처치·도움·사망은 모든 모드 공통). 나머지 칸은 데이터에 기본값만 채워진 것이라 흐리게.
  const USED = {"TDM": [], "Free-for-All": [], "Domination": ["capture_factor", "capture_time_factor"], "Kill Confirm": ["beacon_factor"],
    "Bounty Hunter": ["bounty_factor"], "Flag Strike": ["flag_capture_factor"], "Flag Heist": ["flag_capture_factor"],
    "Payload": ["payload_capture_factor", "payload_time_factor"], "Sentry Takedown": ["sentry_takedown_factor"]};
  const used = (f, k) => ["kill_factor", "assist_kill_factor", "death_factor"].includes(k) || !USED[f.Comment] || USED[f.Comment].includes(k);
  app.innerHTML = `<h1>점수·MVP</h1>
  <div class="grid g-2">
    <section class="panel"><h3>MVP는 누가 받나</h3><p class="small"><b>이긴 팀에서 점수 1등</b>이 MVP, <b>진 팀에서 점수 1등</b>이 SVP입니다. 지면 점수가 아무리 높아도 MVP는 받을 수 없습니다.</p><p class="small muted" style="margin:0">실제 경기 결과 9판에서 모두 이 규칙과 일치(관찰).</p></section>
    <section class="panel"><h3>점수는 어떻게 쌓이나</h3><p class="small">처치·도움·점령 등은 아래 표의 계수만큼, 사망은 그만큼 깎이고, 받은 <b>메달의 보너스 점수</b>가 더해집니다. 피해량도 점수가 되는데, 같은 피해라도 <b>상대 체력이 낮을수록(저레벨 판) 점수가 큽니다</b>.</p><p class="small muted" style="margin:0">관찰: 저레벨 봇 판은 피해 1,000당 약 20점, 20레벨 판은 약 7~8점. 그래서 고레벨일수록 처치·도움 비중이 커집니다(추정).</p></section>
  </div>
  <h2>모드별 점수 계수</h2>
  <div class="panel scroll"><table class="tbl nw"><tr><th>모드</th>${COLS.filter(([k]) => F.some(f => f[k])).map(([, n]) => `<th class="n">${n}</th>`).join("")}</tr>${F.map(f => `<tr><td><b>${esc(MODE[f.Comment] || f.Comment)}</b></td>${COLS.filter(([k]) => F.some(x => x[k])).map(([k]) => used(f, k) ? `<td class="n"><b>${f[k] ? num(f[k]) : "–"}</b></td>` : `<td class="n unused" title="이 모드에는 해당 목표물이 없어 쓰이지 않는 값">${f[k] ? num(f[k]) : "–"}</td>`).join("")}</tr>`).join("")}</table></div>
  <p class="small muted">게임 데이터(전투 점수 계수표) 그대로입니다. 처치 점수는 개인전 60 · 팀 데스매치 50 · 나머지 30. <span class="unused">흐린 숫자</span>는 그 모드에 해당 목표물(점령 지점·화물·깃발 등)이 없어 실제로는 받을 수 없는 값으로, 데이터에 기본값만 채워져 있는 것입니다(추정).</p>
  <h2>보너스 점수가 큰 메달 <span class="small muted">${medals.length}개</span></h2>
  <div class="panel scroll"><table class="tbl"><tr><th class="nw">메달</th><th class="n nw">보너스</th><th>조건</th></tr>${medals.map(m => `<tr><td class="nw">${m.icon ? `<img class="cell" src="img/${encodeURIComponent(m.icon)}.webp" alt="" loading="lazy"> ` : ""}<b>${L(m.name) || "–"}</b></td><td class="n nw">+${num(m.score)}</td><td class="small">${L(m.desc) || ""}</td></tr>`).join("")}</table></div>`;
}

// ---------- 통합 검색 ----------
function find(q0 = "") {
  app.innerHTML = `<h1>검색</h1>
  <div class="filters"><input type="search" id="fq" placeholder="탱크·부품·칩·스킨·오퍼레이터·모드·메달 이름이나 설명" aria-label="통합 검색" value="${esc(q0)}" autofocus><span class="count" id="fcnt"></span></div><div id="fres"></div>`;
  const pool = [];
  D.tanks.forEach(t => pool.push({k: "탱크", n: strip(tname(t)), d: [t.model, strip(t.name?.en), strip(L(t.skill.name)), strip(L(t.trait.name))].join(" · "), h: "#t/" + t.id}));
  const seen = new Set();
  Object.values(D.parts).forEach(p => { const n = strip(L(p.name)); if (!n) return; const d = strip(L(p.desc)); const key = n + "|" + d; if (seen.has(key)) return; seen.add(key);
    const owner = D.tanks.find(t => t.slots.some(sl => sl.includes(p.id))); pool.push({k: "부품", n, d, h: owner ? "#t/" + owner.id : "#parts"}); });
  Object.values(D.chips).forEach(c => { const n = strip(L(c.name)); if (n) pool.push({k: "칩", n, d: strip(L(c.desc)), h: "#chips/" + c.id}); });
  Object.values(D.skins).forEach(s => { const n = strip(L(s.name)); if (n) pool.push({k: "스킨", n, d: s.tank && TANK[s.tank] ? strip(tname(TANK[s.tank])) : "", h: s.tank && TANK[s.tank] ? "#t/" + s.tank : "#skins"}); });
  D.operators.forEach(o => pool.push({k: "오퍼레이터", n: strip(L(o.name)), d: strip(L(o.skill?.desc)), h: "#operators"}));
  D.modes.forEach(m => { const n = strip(L(m.name)); if (n) pool.push({k: "모드", n, d: "", h: "#modes"}); });
  (D.medals || []).forEach(m => { const n = strip(L(m.name)); if (n) pool.push({k: "메달", n, d: strip(L(m.desc)), h: "#growth"}); });
  const draw = () => {
    const q = $("#fq").value.trim().toLowerCase();
    if (q.length < 1) { $("#fres").innerHTML = '<p class="muted">찾을 말을 입력하세요.</p>'; $("#fcnt").textContent = ""; return; }
    const hit = pool.filter(x => (x.n + " " + x.d).toLowerCase().includes(q)).sort((a, b) => (b.n.toLowerCase().includes(q)) - (a.n.toLowerCase().includes(q)));
    $("#fcnt").textContent = hit.length + "개";
    $("#fres").innerHTML = `<div class="hits">${hit.slice(0, 150).map(x => `<a class="hit" href="${x.h}"><span class="k">${x.k}</span><span class="b"><b>${esc(x.n)}</b>${x.d ? `<br><span class="small muted">${esc(x.d.slice(0, 140))}</span>` : ""}</span></a>`).join("")}</div>${hit.length > 150 ? `<p class="small muted">앞 150개만 보여 줍니다. 더 자세히 입력하세요.</p>` : ""}` || '<div class="empty">결과 없음</div>';
    if (!hit.length) $("#fres").innerHTML = '<div class="empty">결과 없음</div>';
  };
  $("#fq").addEventListener("input", draw); draw();
}

render();
</script>
</body>
</html>
