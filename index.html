<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탱크어붐 데이터 도감</title>
<meta name="description" content="Tank-a-Boom 탱크·부품·칩·스킨·모드 데이터">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e2f3d'/%3E%3Crect x='5' y='16' width='22' height='8' rx='2' fill='%23ffb43a'/%3E%3Crect x='10' y='10' width='11' height='7' rx='2' fill='%23ffb43a'/%3E%3Crect x='20' y='12' width='9' height='2.5' fill='%23ffb43a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#1e2f3d; --steel-2:#253a4b; --steel-3:#2f485c; --line:#3b566c;
  --ink:#e9eef2; --ink-2:#a9b9c6; --ink-3:#93a8b9;
  --hazard:#f2c230; --hazard-ink:#1c1a12; --danger:#ff7a6b; --ok:#5fd39a;
  --r1:#9fb0bf; --r2:#4fa8ff; --r3:#c391ff; --r4:#ffb43a;
  --display:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--steel)}
body{margin:0;background:var(--steel);color:var(--ink);font:15px/1.6 var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* 상단 */
header.top{position:sticky;top:0;z-index:20;background:rgba(30,47,61,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:56px}
.brand{font:22px/1 var(--display);letter-spacing:.5px;text-decoration:none;white-space:nowrap}
.maker{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(10,18,26,.45);font:500 14px/1 var(--body);color:var(--ink-3);white-space:nowrap;text-decoration:none}
.maker svg{flex:none}
.ver{font:600 12px/1 var(--body);color:var(--ink-3);white-space:nowrap;padding:5px 9px;border:1px solid var(--line);border-radius:6px}
.ver b{color:var(--ink);font-weight:700}
.bver{display:none}
.maker b{font:800 14px/1 var(--body);letter-spacing:.14em;color:var(--r4)}
.bar .sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang{flex:none}
.lang button{background:none;border:0;padding:4px 10px;cursor:pointer;color:var(--ink-3);white-space:nowrap}
.lshort{display:none}
.lang button[aria-pressed=true]{background:var(--steel-3);color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
nav.tabs a{flex:none;padding:9px 12px 11px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:500;font-size:14px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--hazard)}
nav.tabs a.warn{color:var(--hazard)}

main,main.wrap{padding-top:28px;padding-bottom:64px;min-height:70vh}
h1,h2,h3{margin:0;font-weight:400}
h1{font:clamp(30px,5vw,46px)/1.1 var(--display)}
h2{font:26px/1.2 var(--display);margin:40px 0 14px}
h3{font:700 16px/1.4 var(--body);margin:0 0 6px}
p{margin:0 0 10px}
.lead{color:var(--ink-2);max-width:68ch;margin-top:10px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.ph{font-style:normal;color:var(--hazard);background:rgba(242,194,48,.1);padding:0 4px;border-radius:3px;cursor:help}
.hl{color:#7fd4ff}
.unew{color:var(--hazard)} a[aria-current] .unew{color:inherit}
abbr.term{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}

/* 경고 테이프: 미공개 영역 전용 */
.tape{background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--hazard-ink) 14px 28px);height:10px;border-radius:2px}
.hazard-box{border:2px solid var(--hazard);border-radius:10px;background:linear-gradient(180deg,rgba(242,194,48,.08),transparent 60%);overflow:hidden}
.hazard-box .in{padding:18px 18px 20px}

/* 공통 블록 */
.panel{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:12px}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.r1{color:var(--r1);border-color:color-mix(in srgb,var(--r1) 50%,transparent)}
.pill.r2{color:var(--r2);border-color:color-mix(in srgb,var(--r2) 50%,transparent)}
.pill.r3{color:var(--r3);border-color:color-mix(in srgb,var(--r3) 50%,transparent)}
.pill.r4{color:var(--r4);border-color:color-mix(in srgb,var(--r4) 50%,transparent)}
.pill.st-upcoming,.pill.st-new,.pill.st-tutorial{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
.pill.st-new{background:transparent;color:var(--hazard)}
.pill.st-tutorial{background:transparent;color:var(--ink-2);border-color:var(--line)}
.pill.hid{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 14px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.filters select{background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%}
.count{color:var(--ink-3);font-size:13px;margin-left:auto}

/* 탱크 카드 */
.tcard{display:block;text-decoration:none;background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;border-top:3px solid var(--rc)}
.tcard:hover{background:var(--steel-3)}
.tcard .top{display:flex;gap:12px;align-items:center}
.tcard svg{flex:none}
.tcard .nm{font:21px/1.15 var(--display)}
.tcard .md{color:var(--ink-3);font-size:13px}
.tcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.tcard .stats b{display:block;font-size:16px}
.tcard .stats span{font-size:12px;color:var(--ink-3)}
.tcard .badges{margin-top:10px}

/* 상세 */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.dhead .nm{font:clamp(34px,6vw,54px)/1 var(--display)}
.dhead .sub{color:var(--ink-2);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:500}
.kv dt small{color:var(--ink-3)}
.stat{display:grid;grid-template-columns:minmax(90px,140px) 1fr 64px;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.stat .lab{color:var(--ink-2)}
.stat .v{text-align:right;font-weight:700}
.meter{height:8px;background:var(--steel);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--rc,var(--r2));border-radius:4px}
.lvl{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.lvl input{flex:1;accent-color:var(--hazard)}
.lvl output{font:22px/1 var(--display);min-width:68px}
.ability{border-left:3px solid var(--rc);padding:2px 0 2px 12px;margin-bottom:14px}
.ability .ttl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ability .ttl b{font-size:17px}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.slot .opt{padding:6px 0;border-top:1px dashed var(--line)}
.slot .opt:first-of-type{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--ink-3);font-weight:500;font-size:13px;position:sticky;top:0;background:var(--steel-2)}

.tbl th{white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.scroll{overflow:auto;max-width:100%}
.tbl.nw th,.tbl.nw td{white-space:nowrap}
.unused{opacity:.55}
.tbl td.nw,.tbl th.nw,.tbl td.n{white-space:nowrap}
.best{color:var(--ok);font-weight:700}
details summary{cursor:pointer;color:var(--ink-2)}
details[open] summary{margin-bottom:8px}
.crumbs{font-size:14px;color:var(--ink-3);margin-bottom:12px}
.crumbs a{color:var(--ink-2)}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
code,.mono{font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--ink-2);word-break:break-all}

/* 홈 */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:end}
.lineup{display:flex;align-items:flex-end;gap:2px;overflow:hidden;height:120px;mask-image:linear-gradient(90deg,#000 70%,transparent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:24px}
.facts a{background:var(--steel-2);padding:14px 16px;text-decoration:none}
.facts a:hover{background:var(--steel-3)}
.facts b{font:28px/1 var(--display);display:block}
.facts span{color:var(--ink-2);font-size:13px}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.up a{display:block;text-decoration:none;background:rgba(0,0,0,.18);border-radius:8px;padding:12px}
.up a:hover{background:rgba(0,0,0,.3)}
.upshot{height:120px;margin-bottom:8px}
.upshot .stage{height:100%}
.upshot .shot{padding:6px}

/* 이미지 */
.shot{display:block;width:100%;height:100%;object-fit:contain}
.stage{position:relative;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%),var(--steel);border-radius:8px;overflow:hidden}
.tcard .stage{height:150px;margin:-2px -2px 10px}
.tcard .stage img{padding:8px 10px 2px}
.dhead .stage{width:min(460px,100%);aspect-ratio:4/3}
.dhead .stage img{padding:14px}
.ico{flex:none;object-fit:contain;border-radius:6px}
.ability .ttl .ico{width:40px;height:40px;align-self:center}
.panel .ico.lg{width:64px;height:64px;float:right;margin:0 0 6px 10px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skin{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;cursor:zoom-in;font:inherit;color:inherit}
.skin:hover{border-color:var(--ink-3)}
.skin .stage{aspect-ratio:1;margin-bottom:6px}
.skin b{display:block;font-size:14px;line-height:1.3}
.skin span{font-size:12px;color:var(--ink-3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumb{background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:zoom-in;font:inherit;color:inherit;text-align:left}
.thumb img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:var(--steel);border-radius:5px}
.thumb span{display:block;font-size:12px;line-height:1.3;margin-top:4px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapcard{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--steel)}
.mapcard .in{padding:10px 12px}
.op-av{width:100%;max-height:340px;object-fit:contain;object-position:bottom;display:block;margin-bottom:8px}
dialog.lb{border:1px solid var(--line);background:var(--steel-2);color:var(--ink);border-radius:12px;padding:14px;max-width:min(92vw,820px)}
dialog.lb::backdrop{background:rgba(8,14,20,.78)}
dialog.lb img{max-width:100%;max-height:72vh;display:block;margin:0 auto}
dialog.lb p{margin:10px 0 0;text-align:center}
dialog.lb button{position:absolute;top:8px;right:10px;background:var(--steel-3);border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
b.val{color:var(--ok);font-weight:700}
.ctl{margin-bottom:12px}
.ctl>label,.ctl>.lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.ctl select{width:100%;background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.ctl .note{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.up-g{color:var(--ok)} .dn-r{color:var(--danger)}
.btn{background:var(--hazard);color:var(--hazard-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
/* 탱크 상세 바로가기 */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}
.toc button{font:inherit;font-size:13px;color:var(--ink-2);background:var(--steel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.toc button:hover{color:var(--ink);border-color:var(--hazard)}
main h2,#sec-top{scroll-margin-top:120px}
/* 세부 수치 */
details.vals{margin-top:6px}
details.vals summary{cursor:pointer;color:var(--ink-3);font-size:13px}
details.vals table{margin-top:6px;border-collapse:collapse}
details.vals.sub{margin-top:8px}
details.vals td{font-size:13px;padding:3px 12px 3px 0;vertical-align:top}
details.vals td code{color:var(--ink-3);font-size:12px}
/* 통합 검색 */
.findbtn{color:var(--ink-2);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.findbtn:hover{color:var(--ink);border-color:var(--hazard)}
.hits{display:grid;gap:8px}
.hit{display:flex;gap:10px;align-items:flex-start;text-decoration:none;background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.hit:hover{border-color:var(--hazard)}
.hit .k{flex:none;font-size:12px;color:var(--ink-3);width:64px;padding-top:2px}
.hit .b{min-width:0}
/* 모바일 탱크 목록: 2열 작은 카드 */
@media (max-width:600px){
  .bar .ver{display:none}
  .brand{display:flex;flex-direction:column;justify-content:center;gap:3px}
  .brand .bt{overflow:hidden;text-overflow:ellipsis}
  .brand .bver:not([hidden]){display:block;font:600 12px/1 var(--body);letter-spacing:.02em;color:var(--ink-3)}
  .g-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .g-cards .tcard{padding:8px}
  .g-cards .tcard .stage{height:86px;margin:-2px -2px 6px}
  .g-cards .tcard .stage img{padding:4px}
  .g-cards .tcard .nm{font-size:15.5px}
  .g-cards .tcard .md{font-size:12px}
  .g-cards .tcard .badges{margin-top:6px;gap:4px}
  .g-cards .tcard .badges .opt-m{display:none}
  .g-cards .tcard .stats{gap:2px;margin-top:6px;padding-top:6px}
  .g-cards .tcard .stats b{font-size:13px}
  .g-cards .tcard .stats span{font-size:12px}
}
td img.cell{width:44px;height:44px;object-fit:contain;vertical-align:middle;background:var(--steel);border-radius:4px}


@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .dhead{grid-template-columns:1fr}
  .dhead svg{width:150px;height:auto}
  .stat{grid-template-columns:96px 1fr 58px}
  .bar{gap:7px}
  .brand{font-size:16px;letter-spacing:0}
  .maker{padding:4px 8px 4px 7px;font-size:12px;gap:4px}
  .maker svg{width:14px;height:14px}
  .maker b{font-size:12px;letter-spacing:.08em}
  .lang button{padding:4px 6px;font-size:12.5px}
  .lfull{display:none} .lshort{display:inline}
  .brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
}
@media (prefers-reduced-motion:no-preference){
  .lineup span{animation:roll .7s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes roll{from{transform:translateX(-40px);opacity:0}}

/* ===== 초보·폰 개편(2026-11): 하단 탭, 용어 풀이 창, 접는 구역, 누르는 영역 ===== */
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.gl{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.pill .gl{text-decoration-color:currentColor}
abbr.term,.ph,.gl{-webkit-tap-highlight-color:rgba(242,194,48,.25)}
.note-top{color:var(--ink-2);max-width:68ch;margin:8px 0 0}
.kv small{font-size:12px}
.mcell{display:flex;align-items:center;gap:8px;min-width:104px}
.mcell img{flex:none}
.kv{grid-template-columns:minmax(0,1fr) minmax(0,auto)}
.kv dt,.kv dd{overflow-wrap:anywhere}
.chk,.ctl>label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.ctl>label.chk{color:var(--ink);font-size:14px;margin-bottom:0}
.chk input{accent-color:var(--hazard);flex:none;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.morebtn{display:block;margin:12px auto 0;min-height:44px;padding:8px 18px}
.utabs a{text-decoration:none;padding:4px 12px}
.utabs a[aria-current]{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
.utabs a[aria-current] .muted,.utabs a[aria-current] .unew{color:inherit}
.toc a{font-size:13px;color:var(--ink-2);background:var(--steel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;display:inline-flex;align-items:center}
.toc a:hover{color:var(--ink);border-color:var(--hazard)}
dialog.lb .cap{margin:10px 0 0;text-align:center}
dialog.lb .cap details{text-align:left}

/* 하단 탭(폭 760 이하에서만 보임) */
.btabs{display:none}

/* 용어 풀이 창: 화면 아래에 뜬다 */
.gsheet{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 12px 14px;pointer-events:none}
.gsheet[hidden]{display:none}
.gsheet .in{pointer-events:auto;width:min(560px,100%);background:var(--steel-3);border:1px solid var(--hazard);border-radius:12px;padding:12px 14px 10px 16px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
.gsheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gsheet h3{font-size:17px;margin:0}
.gsheet p{margin:2px 0 6px;font-size:15px;line-height:1.55}
.gsheet .x{flex:none;min-width:44px;min-height:44px;background:var(--steel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:0 12px}
.gsheet a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--ink-2)}

/* 홈 */
.home-hero h1{max-width:16em}
.cta3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:700;font-size:16px;line-height:1.3;border:1px solid var(--line);background:var(--steel-2)}
.cta:hover{border-color:var(--hazard)}
.cta.pri{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
.cta i{font-style:normal;flex:none}
.hsearch{display:flex;gap:8px;margin-top:14px;max-width:560px}
.hsearch input{flex:1;min-width:0;min-height:44px;background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.hsearch button{min-height:44px;flex:none}
.firstlink{display:inline-flex;align-items:center;min-height:44px;color:var(--ink-2);margin-top:4px}
.home-hero+.lineup{margin-top:10px}

/* 더보기 */
.mgroup h2{font-size:21px;margin:26px 0 8px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px}
.mlist a,.mlist .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 14px;background:var(--steel-2);border:1px solid var(--line);border-radius:10px;text-decoration:none;font-weight:500}
.mlist a:hover{border-color:var(--hazard)}
.mlist small{display:block;color:var(--ink-3);font-weight:400;font-size:12.5px;line-height:1.4}
.mlist i{font-style:normal;color:var(--ink-3);flex:none}
.mrow .lang button{min-height:44px;padding:0 14px}

/* 탱크 목록: 역할 칩 한 줄 */
.rolechips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.rolechips::-webkit-scrollbar{display:none}
.rolechips button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--steel-2);color:var(--ink-2);cursor:pointer;font-weight:500;white-space:nowrap}
.rolechips button[aria-pressed=true]{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
details.mf{margin-top:8px}
details.mf>summary{display:inline-block;padding:11px 0;font-size:14px}
details.mf .filters{margin:0 0 6px}
@media (min-width:761px){details.mf>summary{display:none} details.mf .filters{margin:4px 0 6px}}

/* 접는 구역 */
.secs{margin-top:20px}
details.sec{border-top:1px solid var(--line);scroll-margin-top:120px}
.secs>details.sec:last-child,details.sec.last{border-bottom:1px solid var(--line)}
details.sec>summary{display:flex;align-items:center;gap:10px;min-height:56px;list-style:none;color:var(--ink);font:22px/1.2 var(--display);margin:0}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";flex:none;margin:0 8px 4px auto;width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg)}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.sec>summary small{font:400 13px/1.2 var(--body);color:var(--ink-3)}
details.sec>summary:hover{color:var(--hazard)}
details.sec>.body{padding:4px 0 22px}
details.sec.grp>summary{font-size:19px;min-height:52px}
details.sec .body h3{margin-top:14px}

/* 탱크 상세: 한눈에 카드 */
.glance .one{font-weight:500;margin:2px 0 8px}
.gstat{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:0 10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.gstat .lab{color:var(--ink-2);font-size:14px}
.gstat .v{font-weight:700;font-size:17px;text-align:right;min-width:56px}
.gstat .rk{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.gstat .rk b{color:var(--ink)}
.sw{display:grid;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.sw .g{color:var(--ok)} .sw .b{color:var(--danger)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0;max-width:560px}
.acts a{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;text-decoration:none;padding:8px 10px;line-height:1.3}

/* 비교: 항목 이름 칸 고정 */
.cmp td:first-child,.cmp th:first-child{position:sticky;left:0;z-index:1;background:var(--steel-2)}
.cmp th:first-child{z-index:2}
.cmpimg{width:110px;height:110px}


@media (max-width:760px){
  nav.tabs{display:none}
  header.top .lang{display:none}
  .brand{display:flex;flex-direction:column;justify-content:center;min-height:44px}
  .cmp th a{display:inline-block;padding:12px 0}
  .btabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,36,48,.98);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .btabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:12px;font-weight:500;line-height:1.2;color:var(--ink-2);text-decoration:none;white-space:nowrap}
  .btabs a svg{width:22px;height:22px}
  .btabs a[aria-current]{color:var(--hazard)}
  main,main.wrap{padding-top:20px;padding-bottom:calc(56px + 64px + env(safe-area-inset-bottom))}
  .gsheet{bottom:calc(57px + env(safe-area-inset-bottom));padding-bottom:10px}
  .findbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;font-size:13px}
  .filters select,.filters input[type=search],.ctl select{min-height:44px}
  .toc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:14px -16px 4px;padding:0 16px}
  .toc::-webkit-scrollbar{display:none}
  .toc button,.toc a{flex:none;min-height:44px;padding:0 14px}
  details.vals summary{padding:12px 0}
  details:not(.sec):not(.vals):not(.mf)>summary{padding:11px 0}
  .chk{min-height:44px}
  .chk input{width:20px;height:20px}
  .utabs a{min-height:44px;padding:0 14px;display:inline-flex;align-items:center}
  .chippool a.pill{min-height:44px;padding-right:12px}
  button.pill{min-height:44px;padding:0 14px}
  .linkbtn{min-height:44px}
  .btn{min-height:44px}
  dialog.lb button{min-width:44px;min-height:44px}
  .dhead{gap:12px}
  .dhead .stage{width:100%;aspect-ratio:auto;height:160px}
  .dhead .stage img{padding:8px}
  .cta3{grid-template-columns:1fr;margin-top:16px}
  .lineup{height:72px}
  .lineup img{width:60px;height:60px}
  .home-links{display:none}
  .cmpimg{width:64px;height:64px}
  main h2,details.sec,#sec-top{scroll-margin-top:68px}
  .gstat{grid-template-columns:104px 1fr auto}
}
@media (max-width:600px){
  .g-cards .tcard .badges .pill{padding:0 7px}
}
/* 조합 실험실 */
.cx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:16px}
.cx-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cx-col>*{min-width:0}
.cx-card{background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cx-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cx-hd h3{margin:0}
.cx-k{font-size:13px;color:var(--ink-2);font-weight:500}
.cx-btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--steel-3);color:var(--ink);cursor:pointer;font-weight:500;white-space:nowrap}
.cx-btn:hover{border-color:var(--hazard)}
.cx-btn:disabled,.cx-go:disabled,.cx-step button:disabled{opacity:.5;cursor:default;border-color:var(--line)}
.cx-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cx-it{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start}
.cx-it>.ico,.cx-row>.ico,.cx-noimg{background:var(--steel);border-radius:8px}
.cx-noimg{display:inline-block;flex:none}
.cx-it b{font-size:15px}
.cx-ds{font-size:13px;color:var(--ink-2);line-height:1.5}
.cx-hint{margin-top:8px;font-size:13px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.2);color:var(--ink-2)}
.cx-hint.ok{color:var(--ok)}
.cx-hint.tip{color:var(--hazard)}
.cx-cond{display:flex;gap:10px;align-items:center;min-height:44px;padding-top:6px;font-size:13px;line-height:1.45;cursor:pointer}
.cx-cond input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--hazard)}
.cx-seg{display:flex;flex-wrap:wrap;gap:6px}
.cx-seg button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--steel);color:var(--ink-2);cursor:pointer;font-weight:500;white-space:nowrap}
.cx-seg button[aria-pressed=true]{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
.cx-seg .ico{border-radius:50%;background:var(--steel-3)}
#cxop .cx-seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#cxop .cx-seg button{padding:0 8px}
@media (max-width:440px){#cxop .cx-seg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cx-pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--steel);color:var(--ink);cursor:pointer;font-size:13px;font-weight:500}
.cx-pill:hover{border-color:var(--hazard)}
.cx-pill.r1{border-color:color-mix(in srgb,var(--r1) 60%,transparent)}
.cx-pill.r3{border-color:color-mix(in srgb,var(--r3) 60%,transparent)}
.cx-pill.r4{border-color:color-mix(in srgb,var(--r4) 60%,transparent)}
.cx-ps{margin-top:12px}
.cx-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:4px}
.cx-opt{display:block;text-align:left;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--steel);cursor:pointer;line-height:1.45}
.cx-opt[aria-pressed=true]{border-color:var(--hazard);background:rgba(242,194,48,.1)}
.cx-opt>b{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:2px}
.cx-opt>b span{min-width:0}
.cx-opt .cx-ds,.cx-opt .dl{display:block}
.cx-opt .dl{font-size:12px;margin-top:3px}
.cx-ul{margin:0 0 12px;padding-left:18px;color:var(--ink-2)}
.cx-ul li{margin-bottom:4px}
.cx-tag{display:inline-block;font-size:12px;font-weight:700;padding:0 7px;border-radius:999px;line-height:1.6;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2);vertical-align:1px}
b+.cx-tag,.pill+.cx-tag,.cx-tag+.cx-tag{margin-left:6px}
.cx-tag.on{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
.cx-tag.rec{border-color:var(--ok);color:var(--ok)}
.cx-dl{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:12px;line-height:1.5}
.cx-dl span{white-space:nowrap}
.cx-dl span.w{white-space:normal}
/* 늘 보이는 요약 줄: 넓은 화면은 오른쪽 열 맨 위, 좁은 화면은 아래에 고정 */
.cx-sum{position:sticky;top:110px;z-index:5;background:var(--steel-3);border:1px solid var(--hazard);border-radius:10px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.cx-sumv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cx-m .k{display:block;font-size:12px;color:var(--ink-2)}
.cx-m b{font-size:22px;line-height:1.25}
.cx-m .d{font-size:13px;white-space:nowrap}
.cx-sumc{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.cx-sumc select{flex:1;min-width:0;min-height:40px;background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.cx-mini{margin-top:6px}
.cx-mini .cx-m b{font-size:15px}
.cx-mini .cx-m .d{font-size:12px}
/* 저장·비교·자동 찾기 */
.cx-save{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin:8px 0}
.cx-save .cx-btn{padding:0 6px}
.cx-sv{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px dashed var(--line)}
.cx-sv .nm{flex:1;min-width:0;font-size:13px}
.cx-tbl th,.cx-tbl td{white-space:nowrap}
.cx-tbl td:first-child{white-space:normal;min-width:96px}
.cx-tbl .pc{display:block;font-size:12px;font-weight:400}
.cx-df{padding:5px 0;border-top:1px dashed var(--line);line-height:1.7}
.cx-df:first-child{border-top:0}
.cx-res{border-top:1px dashed var(--line);padding:10px 0;margin-top:8px}
/* 고르는 창: 좁은 화면은 아래에서 올라오고(하단 탭 위), 넓은 화면은 가운데 */
.cx-sheet{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,14,20,.72)}
.cx-sheet[hidden]{display:none}
.cx-sheet .in{display:flex;flex-direction:column;width:min(640px,100%);max-height:80vh;max-height:min(80dvh,100%);background:var(--steel-2);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.55);overflow:hidden}
.cx-sheet .hd{flex:none;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line);background:var(--steel-3)}
.cx-sheet .cx-shr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cx-sheet .cx-shr h3{margin:0;font-size:17px}
.cx-sheet .bd{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 12px 14px}
.cx-tools{display:grid;gap:8px;padding:6px 0 8px}
.cx-tools input[type=search]{width:100%;min-height:44px;background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.cx-tools .chk{min-height:44px}
.cx-tools .chk input{width:20px;height:20px}
.cx-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 8px;border:1px solid transparent;border-bottom-color:var(--line);cursor:pointer}
.cx-row:hover{background:rgba(255,255,255,.03)}
.cx-row.on{background:rgba(242,194,48,.08);border-color:var(--hazard);border-radius:8px}
.cx-row.dim>.ico,.cx-row.dim>.b{opacity:.6}
.cx-row.tech{grid-template-columns:40px minmax(0,1fr);cursor:default}
.cx-row .b{min-width:0}
.cx-go{align-self:center;min-width:64px;min-height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--steel-3);color:var(--ink);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.cx-sub{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--ink-2)}
.cx-step{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.cx-step button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--steel-3);color:var(--ink);cursor:pointer;font-size:20px;line-height:1}
.cx-step>span{white-space:nowrap}
#cxfind .chk{min-height:44px}
#cx details>summary{padding:12px 0}
#cx details[open]>summary{margin-bottom:4px}
#cxfind .chk input{width:20px;height:20px}
@media (max-width:900px){
  .cx{grid-template-columns:1fr;padding-bottom:28px}
  .cx-sum{position:fixed;left:0;right:0;top:auto;bottom:0;z-index:29;display:flex;align-items:center;gap:8px;border:0;border-top:1px solid var(--hazard);border-radius:0;box-shadow:0 -6px 18px rgba(0,0,0,.35);padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .cx-sum .cx-sumv{flex:1;min-width:0;gap:6px}
  .cx-sum .cx-m b{font-size:15px}
  .cx-sum .cx-m .d{display:block;font-size:12px;line-height:1.3}
  .cx-sum .cx-m b{display:block;line-height:1.3}
  .cx-sumc{flex:none;margin:0}
  .cx-sumc .k{display:none}
  .cx-sumc select{flex:none;width:96px;min-height:44px;font-size:13px;padding:4px 6px}
}
@media (max-width:400px){
  .cx-save{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cx-save>span{grid-column:1/-1}
  .cx-mini .cx-m b,.cx-mini .cx-m .d{display:block;line-height:1.3}
}
@media (max-width:760px){
  .cx-sum{bottom:calc(57px + env(safe-area-inset-bottom));padding-bottom:6px}
  .cx-sheet{align-items:flex-end;padding:0;bottom:calc(57px + env(safe-area-inset-bottom))}
  .cx-sheet .in{width:100%;border-radius:14px 14px 0 0;border-bottom:0}
}

  <div class="in">
    <div class="hd"><h3 id="gst"></h3><button type="button" class="x" id="gsx">닫기</button></div>
    <p id="gsd"></p>
    <a href="#glossary" id="gsl">용어 풀이 전체 보기</a>
  </div>
</div>
<dialog class="lb" id="lb"><button type="button" id="lbx">닫기</button><img id="lbimg" alt=""><div id="lbcap" class="cap"></div></dialog>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DB;
// 머리글의 게임 데이터 버전(11-08 요청). data.js의 build에서 읽어 업데이트 때 저절로 바뀐다.
{ const v = document.getElementById("ver"), b = D.build || {};
  if (v && b.version) { v.innerHTML = `게임 데이터 <b>v${b.version}</b>`; v.title = `게임 ${b.version} (빌드 ${b.build || "?"}) 데이터 기준`; v.hidden = false; }
  const bv = document.getElementById("bver");   // 좁은 화면: 제목 아래 작은 글씨
  if (bv && b.version) { bv.textContent = `v${b.version}`; bv.title = `게임 ${b.version} 데이터 기준`; bv.hidden = false; } }
let LANG = "ko";
try { LANG = localStorage.getItem("tab-lang") || "ko"; } catch (e) {}
const RC = {0:"var(--ink-3)",1:"var(--r1)",2:"var(--r2)",3:"var(--r3)",4:"var(--r4)"};
const TANK = Object.fromEntries(D.tanks.map(t => [t.id, t]));
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");

// ---------- 헬퍼 ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = o => o ? (o[LANG] || o.ko || o.en || "") : "";
const strip = h => String(h || "").replace(/<[^>]*>/g, "").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
const num = (v, d=2) => v == null ? "–" : (typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString("ko-KR") : (+v.toFixed(d)).toLocaleString("ko-KR")) : esc(v));
const tname = t => L(t.name) || esc(t.model || t.id);
const rname = r => L(D.rarity[r]) || "–";
const rolename = r => r ? L(D.roles[r]) : "역할 없음";
const typename = t => L(D.types[t]) || t;
const manuname = m => D.manu[m] ? L(D.manu[m].name) : m;
const curname = id => {
  if (D.currency[id]) return L(D.currency[id]);
  const tk = D.tanks.find(t => t.id == id); if (tk) return "탱크 " + tname(tk);
  const gd = (D.goods || []).find(g => g.id == id); if (gd && L(gd.name)) return L(gd.name);
  return "#" + id;
};
const costs = c => !c ? "–" : (Array.isArray(c) ? c : [c]).map(x => `${num(x.n)} ${curname(x.id)}`).join(", ") || "–";
const STATUS = {released:null, new:"신규·최근", upcoming:"출시 예정", tutorial:"튜토리얼 전용"};
const stPill = t => STATUS[t.status] ? `<span class="pill st-${t.status}">${STATUS[t.status]}</span>` : "";
const rPill = r => `<span class="pill r${r}">${rname(r)}</span>`;
function modText(m) {
  if (!m || !m.mods) return "";
  return m.mods.map(x => {
    const nm = D.modifiers[x.m] ? L(D.modifiers[x.m].name) : x.m;
    const parts = [];
    if (x.r) parts.push(`${x.r > 0 ? "+" : ""}${num(x.r)}%`);
    if (x.a) parts.push(`${x.a > 0 ? "+" : ""}${num(x.a)}`);
    return `${nm || esc(x.m)} ${parts.join(" / ") || "0"}`;
  }).join(", ");
}
function lvRow(t, lv) { return t.levels.find(x => x.lv === lv) || t.levels[t.levels.length - 1] || {}; }
function dps(t, lv) {
  const l = lvRow(t, lv), f = t.fire, w = t.weapon || {};
  const mag = f.MagazineCapacity || 1, shell = f.ShellReloadTime || w.shellWait || 0;
  const cycle = mag > 1 ? f.ClipReloadTime + (mag - 1) * shell : f.ClipReloadTime;
  return cycle ? (l.dmg || 0) * mag * (w.dmgRate || 1) / cycle : null;
}
const MAXLV = Math.max(...D.tanks.map(t => t.levels.length));

// 탱크 실루엣(차종별)
function tankSvg(t, w=86) {
  const c = RC[t.rarity];
  const geo = {HeavyTank:[6,34,74,16,22,20,32,14,40], MediumTank:[8,36,70,14,26,22,28,12,36], LightTank:[10,38,64,12,30,24,24,11,30], TankDestroyer:[6,36,76,14,14,24,46,12,48]}[t.type] || [8,36,70,14,26,22,28,12,36];
  const [hx,hy,hw,hh,tx,ty,tw,th,bl] = geo;
  const h = Math.round(w * 0.62);
  return `<svg width="${w}" height="${h}" viewBox="0 0 90 56" aria-hidden="true">
    <rect x="${hx}" y="${hy+hh-2}" width="${hw}" height="9" rx="4.5" fill="#132029" stroke="${c}" stroke-opacity=".5"/>
    <path d="M${hx+4} ${hy}h${hw-8}l4 ${hh}h-${hw}z" fill="${c}" fill-opacity=".9"/>
    <rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="4" fill="${c}"/>
    <rect x="${tx+tw-2}" y="${ty+th/2-2}" width="${bl}" height="4" rx="1.5" fill="${c}"/>
    ${[0,1,2,3,4].map(i => `<circle cx="${hx+8+i*(hw-16)/4}" cy="${hy+hh+2.5}" r="2.2" fill="${c}" fill-opacity=".6"/>`).join("")}
  </svg>`;
}
// 게임 이미지
const IMG = (n, alt="", cls="ico", size="") => n ? `<img class="${cls}" src="img/${encodeURIComponent(n)}.webp" alt="${esc(strip(alt))}" loading="lazy" decoding="async" ${size}>` : "";
function tankShot(t, w=200) {
  return t.img ? `<div class="stage" style="--rc:${RC[t.rarity]}">${IMG(t.img, tname(t), "shot")}</div>` : tankSvg(t, w);
}
// 클릭하면 크게 보기: data-zoom="이미지이름" data-cap="설명". 파일 이름은 '개발 데이터' 접기 안에만 보인다
const DEVNOTE = "게임 파일 안의 이름입니다. 플레이에는 몰라도 됩니다.";
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]"); if (!z) return;
  $("#lbimg").src = "img/" + encodeURIComponent(z.dataset.zoom) + ".webp"; $("#lbimg").alt = z.dataset.cap || "";
  $("#lbcap").innerHTML = (z.dataset.cap ? esc(z.dataset.cap) : "") + `<details class="vals"><summary>개발 데이터</summary><span class="small muted">${DEVNOTE}<br>${esc(z.dataset.zoom)}</span></details>`;
  $("#lb").showModal();
});
$("#lbx").addEventListener("click", () => $("#lb").close());
$("#lb").addEventListener("click", e => { if (e.target === $("#lb")) $("#lb").close(); });

// 좁은 화면(폰)인지. 하단 탭이 보이는 폭과 같다
const NARROW = () => matchMedia("(max-width:760px)").matches;
// 이름이 실제로 번역돼 있는지: 한국어 표기에서는 한글이 있어야 하고, 한자(중국어 원문)면 번역 안 된 것으로 본다
const HANGUL = /[가-힣]/, HANZI = /[㐀-鿿]/;
const named = o => { const s = strip(L(o)); return !!s && !HANZI.test(s) && (LANG !== "ko" || HANGUL.test(s)); };
// 부품 칸 이름(내부 이름 → 우리말)
const SLOTKO = {TacticalGear: "전술 부품", Manufacturer: "제조사 부품", TankAbility: "탱크 전용 부품"};
const slotLabel = (i, gloss) => { const ko = SLOTKO[D.slotDef[i]?.type]; return `${i + 1}번 칸${ko ? " · " + (gloss && ko === "전술 부품" ? G(ko) : ko) : ""}`; };
const ELTERM = {Fire: "FireElement", Electric: "ElectricElement", Frost: "FrostElement", Plasma: "PlasmaElement"};

// ---------- 용어 풀이 ----------
// [낱말, 쉬운 말 풀이, 게임 용어집(D.terms) id]. 게임 용어집에 같은 낱말이 있으면 게임 문구를 먼저 쓴다.
const GLOSS = [
  ["내구도", "탱크의 체력입니다."],
  ["장갑", "내구도보다 먼저 깎이는 보호 수치입니다. 임시 장갑 → 장갑 → 내구도 순서로 줄어듭니다."],
  ["임시 장갑", "장갑과 내구도 대신 피해를 먼저 흡수합니다. 4초 유지된 뒤 매초 처음 양의 최대 5%씩 줄어듭니다.", "TemporaryArmor"],
  ["치명타", "150% 피해를 입힙니다. 탱크 뒤쪽의 노란 약점을 맞히면 발생합니다.", "CriticalHit"],
  ["약점", "탱크 뒤쪽의 노란 부분. 맞히면 치명타가 됩니다."],
  ["에너지", "상대를 맞힐 때마다, 그리고 시간이 지나면 충전됩니다. 가득 차면 파워 무브를 씁니다."],
  ["파워 무브", "에너지가 가득 차면 쓰는 탱크 고유 기술입니다."],
  ["고유 특성", "탱크마다 하나씩 가진 고유 효과입니다(게임 화면 이름은 \"능력\")."],
  ["부품", "탱크 레벨을 올려 해제하고 장착하는 강화 아이템입니다."],
  ["전술 부품", "1번 칸. 전투 중 눌러서 잠깐 효과를 냅니다."],
  ["제조사", "탱크를 만든 회사 4곳. 제조사마다 공통 부품과 기술이 있습니다."],
  ["강화 레벨", "같은 탱크를 또 얻으면 오르는 단계입니다."],
  ["오퍼레이터", "경기 중 음성 안내를 하는 동료. 각자 스킬과 특전이 있습니다."],
  ["칩", "탱크에 끼워 추가 효과를 얻는 아이템입니다."],
  ["원소 누적", "화염·냉기·전기·플라스마 수치가 100 쌓이면 초기화되고 상태 이상이 발동합니다."],
  ["화재", "3초 동안 0.5초마다 최대 내구도의 3% 피해를 입습니다.", "Burn"],
  ["동결", "내구도 5% 피해 + 8초 동안 이동·포탑 회전 40% 감소.", "Freeze"],
  ["플라스마 폭발", "최대 내구도의 15% 피해.", "PlasmaExplosion"],
  ["교란", "파워 무브를 쓸 수 없습니다.", "Jammed"],
  ["분산", "조준이 퍼지는 정도. 움직이거나 포탑을 돌리면 커집니다. 작을수록 정확합니다."],
  ["초당 피해(추정)", "이 사이트가 계산한 값. 피해 × 탄창 ÷ 재장전 시간(탄창이 여러 발이면 발 사이 장전 시간 포함)이며 파워 무브·특성·치명타는 뺐습니다."],
  ["유효 체력", "이 사이트가 계산한 값. (내구도 + 장갑) ÷ (1 − 받는 피해 감소)입니다. 받는 피해 감소는 최대 90%까지만 반영합니다."],
];
const TERMBY = Object.fromEntries((D.terms || []).map(x => [x.id, x]));
const glossText = k => { const g = GLOSS.find(x => x[0] === k); if (!g) return ""; const tm = g[2] && TERMBY[g[2]]; return (tm && strip(L(tm.desc))) || g[1]; };
// 점선 밑줄 낱말: 누르면 화면 아래에 풀이 창이 뜬다
const G = (k, lab) => `<span class="gl" data-g="${esc(k)}">${lab ?? esc(k)}</span>`;
const gsEl = $("#gs");
function glossOpen(title, text) { $("#gst").textContent = title; $("#gsd").textContent = text; gsEl.hidden = false; }
function glossClose() { gsEl.hidden = true; }
document.addEventListener("click", e => {
  if (e.target.closest("#gsx, #gsl")) { glossClose(); return; }
  const el = e.target.closest("abbr.term, .ph, [data-g]");
  if (el) {
    if (el.closest("a[href], label")) e.preventDefault();   // 링크·체크 칸 안의 낱말은 풀이만 띄운다
    if (el.matches(".ph")) glossOpen("? 표시", "게임 데이터에서 값을 찾지 못한 자리입니다.");
    else if (el.dataset.g) glossOpen(el.dataset.g, glossText(el.dataset.g));
    else glossOpen(el.textContent.trim(), el.getAttribute("title") || "");
    return;
  }
  if (!gsEl.hidden && !e.target.closest("#gs .in")) glossClose();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !gsEl.hidden) { glossClose(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("abbr.term, .ph, [data-g]")) { e.preventDefault(); e.target.click(); }
});
// 풀이가 붙은 낱말을 키보드로도 고를 수 있게(화면이 다시 그려질 때마다)
new MutationObserver(() => app.querySelectorAll("abbr.term:not([tabindex]), .ph:not([tabindex]), [data-g]:not([tabindex])").forEach(el => { el.tabIndex = 0; el.setAttribute("role", "button"); }))
  .observe(app, {childList: true, subtree: true});
function skinCard(s) {
  const cap = strip(L(s.name) || String(s.id));
  const pic = s.big || s.small;
  return `<button type="button" class="skin" ${pic ? `data-zoom="${esc(s.big || s.small)}" data-cap="${esc(cap)}"` : ""}>
    <div class="stage" style="--rc:${s.kind === "legendary" ? "var(--r4)" : s.kind === "epic" || s.kind === "season" ? "var(--r3)" : s.kind === "event" ? "var(--r2)" : "var(--r1)"}">${IMG(s.small || s.big, cap, "shot")}</div>
    <b>${L(s.name) || s.id}</b><span>${SKINKIND[s.kind]} · ${s.cost ? costs(s.cost) : "기본"}${s.hidden ? ' · <em style="color:var(--danger);font-style:normal">숨김</em>' : ""}${s.fx ? " · 로비 이펙트" : ""}</span></button>`;
}

function spark(pts, w=260, h=64) {
  if (!pts || pts.length < 2) return "";
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(0, ...ys), y1 = Math.max(...ys) || 1;
  const P = pts.map(p => `${((p[0]-x0)/(x1-x0||1)*(w-8)+4).toFixed(1)},${(h-4-(p[1]-y0)/(y1-y0||1)*(h-8)).toFixed(1)}`).join(" ");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="max-width:${w}px;height:${h}px" role="img" aria-label="곡선"><polyline points="${P}" fill="none" stroke="var(--hazard)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
  <div class="row small muted" style="justify-content:space-between;max-width:${w}px"><span>${num(x0,0)}</span><span>${num(x1,0)}</span></div>`;
}

// ---------- 라우터 ----------
const ROUTES = {"": home, tanks, t: tankDetail, build, compare, skills, parts, chips, operators, skins, modes, growth, hidden, gallery, score, find, more, glossary};
const BTAB = {"": "home", tanks: "tanks", t: "tanks", build: "build", hidden: "hidden"};   // 하단 탭: 나머지 화면은 전부 '더보기'
let lastRoute = null;
function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [r, ...args] = h.split("/");
  const known = Object.prototype.hasOwnProperty.call(ROUTES, r);
  glossClose();
  (known ? ROUTES[r] : home)(...args);
  document.querySelectorAll("nav.tabs a").forEach(a => a.toggleAttribute("aria-current", a.getAttribute("href") === "#" + (r === "t" ? "tanks" : r)));
  document.querySelectorAll("nav.tabs a[aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  const bt = known ? (BTAB[r] || "more") : "home";
  document.querySelectorAll("#btabs a").forEach(a => a.dataset.tab === bt ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  // 위쪽 메뉴가 옆으로 밀려 있으면, 지금 메뉴가 보이게 당겨 온다
  { const nv = document.querySelector("nav.tabs"), on = nv.querySelector("a[aria-current]");
    if (on && (on.offsetLeft < nv.scrollLeft || on.offsetLeft + on.offsetWidth > nv.scrollLeft + nv.clientWidth)) nv.scrollLeft = Math.max(0, on.offsetLeft - 16); }
  syncLang();
  if (lastRoute !== h) { if (!h.includes("?")) window.scrollTo(0, 0); lastRoute = h; }
}
window.addEventListener("hashchange", render);
// 폰 폭과 넓은 폭을 오갈 때(회전·창 크기 변경) 접기 기본값이 달라지므로 다시 그린다
matchMedia("(max-width:760px)").addEventListener("change", () => render());
// 메뉴가 화면보다 길면 오른쪽 끝을 흐리게(더 있다는 표시). 끝까지 밀면 지운다.
{ const nv = document.querySelector("nav.tabs");
  const fade = () => nv.classList.toggle("more", nv.scrollLeft + nv.clientWidth < nv.scrollWidth - 4);
  nv.addEventListener("scroll", fade, {passive: true}); window.addEventListener("resize", fade); fade(); }
// 언어 전환: 머리글과 '더보기' 화면 두 곳에 버튼이 있어 문서에서 한 번에 받는다
function syncLang() { document.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", x.dataset.lang === LANG)); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b) return;
  LANG = b.dataset.lang; try { localStorage.setItem("tab-lang", LANG); } catch (err) {}
  render();
});

// ---------- 홈 ----------
function home() {
  const up = D.tanks.filter(t => t.status !== "released" && t.status !== "tutorial");
  const lineup = [...D.tanks].filter(t => t.imgQ).sort((a,b) => b.rarity - a.rarity);
  const umodes = D.hidden.unreleasedModes.map(id => D.modes.find(m => m.id === id)).filter(Boolean);
  app.innerHTML = `
  <section class="home-hero">
    <h1>게임에 안 나오는 숫자까지, 탱크어붐 도감</h1>
    <p class="lead">탱크 ${D.tanks.length}대의 숨은 능력치, 부품·칩 효과, 곧 나올 탱크를 한곳에서 봅니다.</p>
    <div class="cta3">
      <a class="cta pri" href="#tanks">내 탱크 찾기<i aria-hidden="true">→</i></a>
      <a class="cta" href="#build">조합 실험실에서 끼워 보기<i aria-hidden="true">→</i></a>
      <a class="cta" href="#hidden">곧 나올 탱크·모드 보기<i aria-hidden="true">→</i></a>
    </div>
    <form class="hsearch" id="hsearch" role="search"><input type="search" id="hq" placeholder="탱크·부품·칩 이름으로 찾기" aria-label="통합 검색" enterkeyhint="search"><button type="submit" class="btn ghost">찾기</button></form>
    <a class="firstlink" href="#glossary">처음이신가요? 용어 풀이 보기</a>
  </section>
  <div class="lineup" aria-hidden="true">${lineup.map((t,i) => `<span style="animation-delay:${i*40}ms;display:inline-block;flex:none">${IMG(t.imgQ, "", "ico", 'width="96" height="96"')}</span>`).join("")}</div>

  <h2>출시 예정</h2>
  <div class="hazard-box"><div class="tape"></div><div class="in">
    <div class="up">
      ${up.map(t => `<a href="#t/${t.id}">${t.img ? `<div class="upshot">${tankShot(t)}</div>` : ""}<div class="row">${stPill(t)}${rPill(t.rarity)}</div>
        <div style="font:22px/1.2 var(--display);margin-top:6px">${tname(t)}</div>

const STATMAX = {};
function statMax(key, f) { if (!(key in STATMAX)) STATMAX[key] = Math.max(...D.tanks.filter(t => t.status === "released" || t.status === "new").map(f).filter(x => x != null && isFinite(x))); return STATMAX[key]; }
// 능력 데이터 세부 수치: 이름을 우리말로(전부 아는 낱말일 때만), 단위는 이름으로 짐작(거리 cm→m, 비율→%, 시간→초)
const VW = {Damage:"피해",Increase:"증가",Decrease:"감소",Ratio:"비율",Range:"거리",Distance:"거리",Radius:"반경",Duration:"지속",Time:"시간",Delay:"지연",
  Cooldown:"재사용",Reload:"재장전",Clip:"",Element:"원소",Heal:"회복",Armor:"장갑",Energy:"에너지",Speed:"속도",Max:"최대",Min:"최소",Count:"횟수",Num:"개수",
  Bomb:"폭탄",Extra:"추가",Bombing:"광역 폭발",Health:"체력",Height:"높이",Shield:"보호막",Charge:"충전",Shot:"사격",Shell:"포탄",Rocket:"로켓",Missile:"미사일",
  Selection:"선택",Explode:"폭발",Explosion:"폭발",Warning:"경고",Buff:"버프",Limit:"제한",Fov:"시야각",Target:"목표",Projectile:"포탄",Change:"전환",Value:"값"};
function dispLabel(k) {
  const w = k.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[._]/g, " ").split(/\s+/).filter(Boolean);
  const ko = w.map(x => VW[x] ?? null);
  return ko.every(x => x !== null) ? ko.filter(Boolean).join(" ") : "";
}
function dispVal(k, v, u) {
  const UNIT = {"m": x => num(x / 100, 1) + "m", "m/s": x => num(x / 100, 1) + "m/s", "m/s²": x => num(x / 100, 1) + "m/s²",
    "%": x => num(x * 100, 1) + "%", "%p": x => num(x, 1) + "%", "초": x => num(x, 2) + "초", "°": x => num(x, 1) + "°", "°/s": x => num(x, 1) + "°/s",
    "x": x => "×" + num(x, 2), "": x => num(x, 2)};
  const one = u !== undefined ? (UNIT[u] || (x => num(x, 2) + u)) : x => {
    if (/Range|Distance|Radius|Height/.test(k) && Math.abs(x) >= 100) return num(x / 100, 1) + "m";
    if (/Ratio|Factor|Chance|Multiplier/.test(k) && Math.abs(x) <= 5) return num(x * 100, 1) + "%";
    if (/Increase|Decrease|Reduce|Rate/.test(k) && !/Time|Speed|Num|Count/.test(k) && Math.abs(x) <= 1) return num(x * 100, 1) + "%";
    if (/Duration|Time|Delay|Cooldown|Interval/.test(k)) return num(x, 2) + "초";
    return num(x, 2);
  };
  return Array.isArray(v) ? one(v[0]) + " ~ " + one(v[1]) : one(v);
}
function dispTable(list) {
  if (!list || !list.length) return "";
  // 한글 이름이 있는 값을 먼저 보이고, 번역 안 된 값은 안쪽에 접어 둔다(원래 이름을 띄어 써서 표시)
  const row = (l, [k, v, , u]) => `<tr><td>${l}</td><td><b>${dispVal(k, v, u)}</b></td></tr>`;
  const lab = e => e[2] || dispLabel(e[0]);

  return `<details class="vals"><summary>세부 수치 ${list.length}개 (게임 데이터)</summary>${ko.length ? `<table>${ko.map(e => row(esc(lab(e)), e)).join("")}</table>` : ""}${enT}</details>`;
}
function meterRow(lab, val, max, unit="", invert=false) {
  const pct = max ? Math.max(3, Math.min(100, (invert ? (max / (val || max)) * 40 : val / max * 100))) : 0;
  return `<div class="stat"><span class="lab">${lab}</span><span class="meter"><i style="width:${pct}%"></i></span><span class="v">${num(val)}${unit}</span></div>`;
}
// '한눈에' 카드: 핵심 수치 5개와 순위. 순위는 출시된 탱크(출시·신규)끼리만 매기고, 출시 예정·튜토리얼 전용은 뺀다.
const RANKED = D.tanks.filter(t => t.status === "released" || t.status === "new");
// [키, 이름, 용어 풀이 낱말, 값, 방향(1=클수록 좋음, -1=작을수록 좋음), 단위]
const GSTATS = [
  ["hp", "내구도", "내구도", t => lvRow(t, MAXLV).hp, 1, ""],
  ["ar", "장갑", "장갑", t => lvRow(t, MAXLV).ar, 1, ""],
  ["dmg", "1발 피해", "", t => lvRow(t, MAXLV).dmg, 1, ""],
  ["reload", "재장전", "", t => t.fire.ClipReloadTime, -1, "초"],
  ["dps", "초당 피해(추정)", "초당 피해(추정)", t => { const d = dps(t, MAXLV); return d == null ? null : Math.round(d); }, 1, ""],
];
const RANKVALS = {};
function rankOf(key, f, dir, v) {
  const vs = RANKVALS[key] ||= RANKED.map(f).filter(x => x != null && isFinite(x));
  const better = vs.filter(x => dir > 0 ? x > v : x < v).length, worse = vs.filter(x => dir > 0 ? x < v : x > v).length;

  const names = xs => xs.map(x => `${x.lab} ${x.r.rank}위`).join(", ");
  const one = [[t.role ? strip(rolename(t.role)) : "", strip(typename(t.type))].filter(Boolean).join(" "), strip(L(t.skill.name)) ? `파워 무브 ‘${esc(strip(L(t.skill.name)))}’` : ""].filter(Boolean).join(" · ");

    <p class="one">${one}</p>
    ${rows.map(x => `<div class="gstat"><span class="lab">${x.g ? G(x.g, x.lab) : x.lab}</span><span class="meter"><i style="width:${x.pct}%"></i></span><span class="v">${num(x.v)}${x.unit}</span>
      ${ranked ? `<span class="rk">출시된 탱크 ${x.r.n}대 중 <b>${x.r.rank}위</b>${x.dir < 0 ? " · 짧을수록 좋음" : ""}</span>` : ""}</div>`).join("")}
    ${ranked ? `<div class="sw"><div><b class="g">강점</b> ${strong.length ? names(strong) : '<span class="muted">상위 8위 안에 드는 수치 없음</span>'}</div><div><b class="b">약점</b> ${weak.length ? names(weak) : '<span class="muted">하위 8위 안에 드는 수치 없음</span>'}</div></div>`
      : `<p class="small muted" style="margin:10px 0 0">${STATUS[t.status] || "출시 전"} 탱크라 순위는 매기지 않고 값만 보여 줍니다. 막대는 출시된 탱크 중 가장 좋은 값과 견준 길이입니다.</p>`}
  </section>`;
}

  const root = $("#cx"), shEl = $("#cxsh");

  const slotInfo = i => {
    const curP = st.slots[i];

      const pt = D.parts[p], other = st.slots.indexOf(p), cf = condOf(t, "p", p);
      const x = {p, pt, n, other, cur: p === curP, swap: other >= 0 && other !== i, quant: !!pt?.fx?.length, condq: cf.length > 0, ok: true, slots: st.slots, s: cur, d: 0, dC: 0, hasC: false};
      if (!x.cur) {

        s2[i] = p; x.slots = s2; x.s = stat({...st, slots: s2}); x.d = scd(cur, x.s);

  const sheetSlot = () => {

    else if (a === "addchip") { if (!st.chips.includes(id)) st.chips = [...st.chips, id]; if (st.condAll) (D.chips[id]?.cfx || []).forEach((_, n) => st.cond[`c:${id}:${n}`] = true); }
    else if (a === "rar") { if (!sh) return; sh.rar = b.dataset.v; shEl.querySelectorAll('[data-act="rar"]').forEach(x => x.setAttribute("aria-pressed", x === b)); drawSheet(); $("#cxshbd").scrollTop = 0; return; }
    else if (a === "op") { if (st.op === id) return; dropCond("o:"); st.op = id; st.perks = OPBY[id] ? OPBY[id].slots.map(s => s[0]) : []; }
    else if (a === "perk") { const old = st.perks[i]; if (old) dropCond(`o:${old}:`); st.perks[i] = old === id ? 0 : id; }
    else if (a === "techmax") st.tech = {...maxTech};
    else if (a === "techoff") st.tech = {};
    else if (a === "tinc" || a === "tdec") { const x = techAll.find(y => y.id === id); if (!x) return; const n = Math.max(0, Math.min(x.levels.length, (st.tech[id] || 0) + (a === "tinc" ? 1 : -1))); if (n) st.tech[id] = n; else delete st.tech[id]; }
    else if (a === "condall") det.cond.forEach(c => st.cond[c.k] = true);
    else if (a === "condnone") det.cond.forEach(c => delete st.cond[c.k]);
    else if (a === "save") { sv[k] = snap(labFix(t, st)); save(); }
    else if (a === "del") { delete sv[k]; if (st.cmp === k) st.cmp = "bare"; save(); }
    else if (a === "load") { if (!sv[k]) return; Object.assign(st, snap(sv[k])); }
    else return;
    draw();
  });
  root.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.ck) { if (el.checked) st.cond[el.dataset.ck] = true; else delete st.cond[el.dataset.ck]; return draw(); }
    if (el.id === "cxtank") { location.hash = "#build/" + el.value; return; }

}
function fxLabel(x) {

}

// ---------- 비교 ----------
function compare(ids) {
  let sel = (ids || "").split(",").map(Number).filter(i => TANK[i]);
  // 주소에 탱크가 없을 때: 폰은 2대, 넓은 화면은 3대로 시작
  if (!sel.length) sel = (NARROW() ? [20006, 20018] : [20006, 20018, 20007]).filter(i => TANK[i]);
  while (sel.length < 2) sel.push(D.tanks.find(t => !sel.includes(t.id)).id);
  let lv = MAXLV, full = !NARROW();   // 폰은 핵심 6행만 먼저 보인다
  const options = cur => D.tanks.map(t => `<option value="${t.id}" ${t.id===cur?"selected":""}>${strip(tname(t))} (${esc(t.model)})</option>`).join("");
  // 앞의 5행(+ 파워 무브)이 기본으로 보이는 핵심 행
  const ROWS = [
    [G("내구도"), t => lvRow(t,lv).hp, 1], [G("장갑"), t => lvRow(t,lv).ar, 1], ["1발 피해", t => lvRow(t,lv).dmg, 1],
    ["재장전(초)", t => t.fire.ClipReloadTime, -1], [G("초당 피해(추정)"), t => Math.round(dps(t,lv)), 1],
    ["탄창", t => t.fire.MagazineCapacity, 1], [G("분산", "기본 분산"), t => t.fire.Dispersion, -1],
    ["조준 수렴", t => t.fire.AimingSpeedFactor, 1], ["이동 중 분산", t => t.fire.ChassisMoveDispersionFactor, -1], ["포탑 회전(°/s)", t => t.fire.TurretRotationSpeed, 1],
    ["최대 피해 거리(m)", t => t.fire.FullDamageRange/100, 1], ["포탄 초속(m/s)", t => (t.proj?.InitialSpeed||0)/100, 1], [G("치명타", "치명타 배율"), t => t.proj?.CritDamageMultiplier, 1],
    ["초치명 확률(%)", t => (t.proj?.SuperCritChance||0)*100, 1], ["타격당 에너지", t => t.energy.EnergyPerHit, 1], ["초당 에너지", t => t.energy.EnergyPerSecond, 1],
    ["파워 무브 비용", t => t.energy.AbilityEnergyCost, -1], ["질량(kg)", t => t.move.OverrideVehicleMass, 0], ["선회(°/s)", t => t.move.SteeringAngularSpeed, 1],
    ["충돌 강도", t => t.energy && t.body.RammingStrength, 1],
  ];
  const BASIC = 5;
  const draw = () => {
    const ts = sel.map(i => TANK[i]);
    const row = ([lab, f, dir]) => { const vs = ts.map(f); const best = dir ? (dir > 0 ? Math.max(...vs.filter(v=>v!=null)) : Math.min(...vs.filter(v=>v!=null))) : null;
      return `<tr><td class="muted nw">${lab}</td>${vs.map(v => `<td class="${dir && v === best && new Set(vs).size > 1 ? "best" : ""}">${num(v)}</td>`).join("")}</tr>`; };
    $("#cmp").innerHTML = `<table class="tbl cmp"><tr><th></th>${ts.map(t => `<th style="color:${RC[t.rarity]}">${t.imgS ? `<div class="cmpimg">${IMG(t.imgS, tname(t), "shot")}</div>` : ""}<a href="#t/${t.id}">${tname(t)}</a><div class="small muted">${rolename(t.role)} · ${typename(t.type)}</div></th>`).join("")}</tr>
      <tr><td class="muted nw">${G("파워 무브")}</td>${ts.map(t => `<td>${L(t.skill.name)}</td>`).join("")}</tr>
      ${ROWS.slice(0, BASIC).map(row).join("")}
      ${full ? `<tr><td class="muted nw">${G("고유 특성")}</td>${ts.map(t => `<td>${L(t.trait.name)}</td>`).join("")}</tr>${ROWS.slice(BASIC).map(row).join("")}` : ""}</table>`;
    $("#cfull").textContent = full ? "간단히 보기" : `자세히 보기 (${ROWS.length - BASIC + 1}행 더)`;
    $("#cfull").setAttribute("aria-expanded", full);
    history.replaceState(null, "", "#compare/" + sel.join(","));
  };
  app.innerHTML = `<h1>탱크 비교</h1>
  <p class="note-top">초록색이 더 좋은 값입니다.</p>
  <div class="filters" id="pick">${sel.map((id, i) => `<select data-i="${i}" aria-label="탱크 ${i+1}">${options(id)}</select>`).join("")}
    ${sel.length < 4 ? `<button type="button" id="add" class="pill" style="cursor:pointer;background:none;padding:6px 12px">탱크 추가</button>` : ""}
    <label class="row small">레벨 <input type="range" id="clv" min="1" max="${MAXLV}" value="${lv}" style="accent-color:var(--hazard)"> <output id="clvo">${lv}</output></label></div>
  <div class="panel scroll" id="cmp"></div>
  <button type="button" class="btn ghost morebtn" id="cfull"></button>`;
  app.querySelectorAll("#pick select").forEach(s => s.addEventListener("input", () => { sel[+s.dataset.i] = +s.value; draw(); }));
  $("#add")?.addEventListener("click", () => { sel.push(D.tanks.find(t => !sel.includes(t.id)).id); compare(sel.join(",")); });
  $("#clv").addEventListener("input", e => { lv = +e.target.value; $("#clvo").textContent = lv; draw(); });
  $("#cfull").addEventListener("click", () => { full = !full; draw(); });
  draw();
}

// ---------- 부품 ----------
function partGroup(p) {
  const k = p.key || "";
  let m = k.match(/LOC_MODIFY_(\d{5})_/); if (m) return "t" + m[1];
  if (/LOC_Gear/i.test(k)) return "gear";
  m = k.match(/LOC_MODIFY_([A-Z]+)_/); if (m) return "m" + m[1];
  return "etc";
}
function parts() {
  const groups = {};
  Object.values(D.parts).forEach(p => (groups[partGroup(p)] ||= []).push(p));
  const gname = g => g === "gear" ? "공용 장비(기어)" : g === "etc" ? "기타" : g[0] === "t" ? (TANK[g.slice(1)] ? strip(tname(TANK[g.slice(1)])) + " 전용" : g.slice(1)) : (D.manu[g.slice(1)] ? strip(manuname(g.slice(1))) + " 제조사" : g.slice(1));
  // 이름이 번역된 부품이 절반도 안 되는 묶음(출시 예정 탱크용 등)은 맨 뒤 '아직 번역되지 않은 부품'으로 모은다
  const untr = g => groups[g].filter(p => named(p.name)).length * 2 < groups[g].length;
  const all = Object.keys(groups).sort((a,b) => (a==="gear"?-1:0) - (b==="gear"?-1:0) || a.localeCompare(b));
  const order = [...all.filter(g => !untr(g)), ...all.filter(untr)];

  const draw = () => {

    const filt = !!(q || gs || tk);   // 찾는 중이면 묶음을 펼쳐서 보여 준다
    // 탱크를 고르면 그 탱크 장착 칸에 들어 있는 부품 전부(전용 + 제조사 공용 + 공용 장비)
    const can = tk && TANK[tk] ? new Set(TANK[tk].slots.flat().map(String)) : null;
    const block = g => {
      const hit = groups[g].filter(p => (!can || can.has(String(p.id))) && (!q || strip(L(p.name) + " " + L(p.desc)).toLowerCase().includes(q)));
      // 탱크마다 따로 들어 있는 같은 부품(이름·설명·비용이 같음)은 한 장으로 합친다
      const uniq = new Map();
      hit.forEach(p => { const k = L(p.name) + "|" + L(p.desc) + "|" + JSON.stringify(p.cost); const u = uniq.get(k); u ? u.n++ : uniq.set(k, {p, n: 1}); });

      return {g, n: items.length, html: `<div class="grid g-3">${items.map(({p, n: c}) => `<div class="panel">${IMG(p.icon, L(p.name), "ico lg")}<h3>${L(p.name) || '<span class="muted">이름 없음(미번역)</span>'}</h3><p class="small">${L(p.desc)}</p><p class="small muted" style="margin:0">${costs(p.cost)}${c > 1 ? ` · 같은 부품 ${c}개` : ""}</p></div>`).join("")}</div>`};
    };
    const show = order.filter(g => !gs || g === gs).map(block).filter(b => b.n);

function objTable(rows) {
  const keys = [...new Set(Object.values(rows).flatMap(r => Object.keys(r)))];

}

    $("#mlist").innerHTML = `<tr><th>메달</th><th class="n">보너스 점수</th><th>조건</th></tr>` + ls.slice(0, mshow).map(m => `<tr><td><div class="mcell">${m.icon ? `<img class="cell" src="img/${encodeURIComponent(m.icon)}.webp" alt="" loading="lazy">` : ""}<span><b>${L(m.name) || "–"}</b> ${m.locOnly ? '<span class="pill st-new">텍스트만</span>' : ""}</span></div></td><td class="n">${num(m.score)}</td><td class="small">${L(m.desc)}</td></tr>`).join("");
    $("#mmore").hidden = ls.length <= mshow; $("#mmore").textContent = `더 보기 (남은 ${Math.max(0, ls.length - mshow)}개)`; };
  $("#mq").addEventListener("input", () => { mshow = 20; md(); });
  $("#mmore").addEventListener("click", () => { mshow += 20; md(); });
  md();
}

// ---------- 미공개 ----------
const UTABS = [["tanks","탱크"],["modes","모드"],["maps","맵"],["skins","스킨"],["parts","부품"],["chips","칩"],["etc","기타"]];
const UGROUP = {tanks: {upcoming: "출시 예정", tutorial: "튜토리얼 전용"},

    ${(m.desc || []).map(d => `<p class="small" style="margin:8px 0 0">${L(d)}</p>`).join("")}<details class="vals"><summary>개발 데이터</summary><p class="small muted mono" style="margin:0">${esc(m.type)} · 설정 ${m.id}${m.cls ? " · " + esc(m.cls) : ""}</p></details></section>`; };
  const mapCard = x => { const m = D.maps.find(y => y.id === x.id), cap = strip(L(m.name) || m.path); return `<div class="mapcard">${m.bg ? `<img src="img/${encodeURIComponent(m.bg)}.webp" alt="${esc(cap)}" loading="lazy" data-zoom="${esc(m.bg)}" data-cap="${esc(cap)}" style="cursor:zoom-in">` : ""}
    <div class="in"><div class="row" style="justify-content:space-between"><b>${L(m.name) || esc(m.path)}</b>${m.mini ? `<button type="button" class="pill" style="cursor:zoom-in;background:none" data-zoom="${esc(m.mini)}" data-cap="${esc(cap)} 미니맵">미니맵</button>` : ""}</div>
    <div class="row" style="margin-top:4px">${m.disabled ? '<span class="pill hid">비활성</span>' : ""}${since(x)}</div><details class="vals"><summary>개발 데이터</summary><span class="small muted">${m.id} · <span class="mono">${esc(m.path)}</span></span></details></div></div>`; };
  const skinItem = x => { const sk = D.skins[x.id], t = TANK[sk.tank]; return `<div>${skinCard(sk)}<div class="row small" style="margin-top:4px;gap:4px">${t ? `<a href="#t/${t.id}">${tname(t)}</a>` : ""}${why(x)}${since(x)}</div></div>`; };
  const partItem = x => { const p = D.parts[x.id]; return `<div class="panel">${IMG(p.icon, L(p.name), "ico lg")}<h3>${L(p.name) || '<span class="muted">이름 없음(미번역)</span>'}</h3><p class="small">${L(p.desc)}</p>

  const chipItem = x => { const c = D.chips[x.id]; return `<div class="panel"><h3><a href="#chips/${x.id}">${L(c.name) || x.id}</a></h3><p class="small">${L(c.desc)}</p><div class="row small" style="gap:4px">${why(x)}${since(x)}</div></div>`; };
  const flat = (k, card, grid) => { const xs = items(k); return xs.length ? `<div class="${grid === "skins" ? "skins" : "grid " + grid}">${xs.map(card).join("")}</div>` : ""; };

    <div class="panel"><h3>미사용 무기 유형</h3><p class="small">${H.unusedWeaponTypes.map(esc).join(", ") || "없음"}</p></div>
    <div class="panel"><h3>미구현 메달 ${H.locOnlyMedals.length}개</h3><p class="small"><a href="#growth">메달 보기</a></p></div>
    <div class="panel"><h3>프리즘 등급 칩 ${H.prismaticChips.length}개</h3><p class="small">${H.prismaticChips.map(c => `<a href="#chips/${c}">${L(D.chips[c].name) || c}</a>`).join(", ") || "없음"}</p></div>
  </div>
  <h2>미번역 문구 <span class="small muted">${Object.values(H.untranslated).reduce((a,b)=>a+b.length,0)}개</span></h2>
  <p class="small muted">한국어 번역이 아직 없는 게임 문구입니다. 펼치면 왼쪽 칸에 게임 파일 안의 이름이 함께 보입니다.</p>
  ${Object.entries(H.untranslated).sort((a,b) => b[1].length - a[1].length).map(([g, xs]) => `<details class="panel" style="margin-bottom:8px"><summary><b>${esc(g)}</b> <span class="muted">${xs.length}</span></summary><div class="scroll"><table class="tbl">${xs.map(x => `<tr><td class="mono" style="width:40%">${esc(x.k)}</td><td class="small">${x.en}</td></tr>`).join("")}</table></div></details>`).join("")}`;
  const body = {tanks: () => grouped("tanks", tankCard, "g-2"), modes: () => grouped("modes", modeCard, "g-2"), maps: () => grouped("maps", mapCard, "g-3"),
    skins: () => flat("skins", skinItem, "skins"), parts: () => flat("parts", partItem, "g-3"), chips: () => flat("chips", chipItem, "g-3"), etc}[tab]();
  const cnt = k => { if (k === "etc") return ""; const n = C[k].length, nn = C[k].filter(isNew).length; return ` <span class="muted">${n}</span>${nn ? ` <b class="unew">+${nn}</b>` : ""}`; };
  app.innerHTML = `<h1>미공개·출시 예정</h1>
  <p class="note-top">게임 파일에는 있지만 아직 게임에 나오지 않은 것들입니다. 실제로 안 나오거나 바뀔 수 있습니다(추정).</p>
  <p class="small muted" style="margin:6px 0 0">출시 예정 = 한국어 이름이 아직 없음 · 신규 = 이번 버전에서 처음 등장 · 숨김 = 게임 안에서 가려 둠</p>
  <nav class="row utabs" style="margin:16px 0 10px;gap:6px" aria-label="미공개 분류">${UTABS.map(([k, lab]) => `<a class="pill" href="#hidden/${k}"${k === tab ? ' aria-current="true"' : ""}>${lab}${cnt(k)}</a>`).join("")}</nav>
  ${tab === "etc" ? "" : `<label class="chk small" style="margin-bottom:12px"><input type="checkbox" id="unew" ${UNEW ? "checked" : ""}>${esc(U.latest)} 업데이트에서 새로 생긴 것만</label>`}
  <div class="hazard-box"><div class="tape"></div><div class="in">${body || '<div class="empty">해당 항목 없음</div>'}</div></div>`;
  $("#unew")?.addEventListener("change", e => { UNEW = e.target.checked; hidden(tab); });
}

// ---------- 이미지 갤러리 ----------
let GAL = null;
function gallery(group) {
  const groups = D.gallery.filter(g => g[2]);
  group = group || groups[0][0];
  app.innerHTML = `<h1>이미지</h1>
  <nav class="row utabs" style="margin:16px 0" aria-label="이미지 분류">${groups.map(([g, lab, n]) => `<a class="pill" href="#gallery/${g}"${g === group ? ' aria-current="true"' : ""}>${esc(lab)} ${n}</a>`).join("")}</nav>
  <div class="filters"><input type="search" id="q" placeholder="이름 검색" aria-label="이미지 검색"><span class="count" id="cnt"></span></div><div class="thumbs" id="list"><div class="empty">불러오는 중…</div></div>
  <button type="button" class="btn ghost morebtn" id="gmore" hidden></button>`;
  let shown = 60;   // 60장씩 보인다
  const draw = () => {
    const q = $("#q").value.trim().toLowerCase();
    const ls = (GAL[group] || []).filter(([n, c]) => !q || (n + " " + strip(L(c))).toLowerCase().includes(q));
    $("#cnt").textContent = ls.length + "장";
    $("#list").innerHTML = ls.slice(0, shown).map(([n, c]) => { const cap = strip(L(c)) || n.replace(/^T_(UI_|HQ_|common_|callingcard_)?/i, "").replace(/_/g, " "); return `<button type="button" class="thumb" data-zoom="${esc(n)}" data-cap="${esc(cap)}"><img src="img/${encodeURIComponent(n)}.webp" alt="${esc(cap)}" loading="lazy" decoding="async"><span>${esc(cap)}</span></button>`; }).join("") || '<div class="empty">결과 없음</div>';
    $("#gmore").hidden = ls.length <= shown; $("#gmore").textContent = `더 보기 (남은 ${Math.max(0, ls.length - shown)}장)`;
  };
  const go = () => { $("#q").addEventListener("input", () => { shown = 60; draw(); }); $("#gmore").addEventListener("click", () => { shown += 60; draw(); }); draw(); };
  if (GAL) return go();
  fetch("gallery.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => { GAL = j; if ($("#gmore")) go(); })
    .catch(() => { if ($("#list")) $("#list").innerHTML = '<div class="empty">이미지 목록을 불러오지 못했습니다. 새로고침해 보세요.</div>'; });
}

// ---------- 점수·MVP ----------
function score() {
  const F = Object.values(D.scoreFactors || {});
  const COLS = [["kill_factor", "처치"], ["assist_kill_factor", "도움"], ["death_factor", "사망(−)"], ["capture_factor", "점령"], ["capture_time_factor", "점령 유지"],
    ["beacon_factor", "신호기"], ["bounty_factor", "현상금"], ["flag_capture_factor", "깃발"], ["payload_capture_factor", "화물 점령"], ["payload_time_factor", "화물 이동"], ["sentry_takedown_factor", "파수꾼"]];
  // 모드 이름은 모드·맵 화면과 같게, 게임 데이터(D.modes)의 이름을 쓴다
  const modeName = c => { const m = D.modes.find(x => x.id < 1100 && (x.name?.en === c || x.type === c)); return (m && strip(L(m.name))) || c; };
  const medals = (D.medals || []).filter(m => m.score).sort((a, b) => b.score - a.score);
  // 모드마다 실제로 쓰이는 목표물 칸(처치·도움·사망은 모든 모드 공통). 나머지 칸은 데이터에 기본값만 채워진 것이라 흐리게.
  const USED = {"TDM": [], "Free-for-All": [], "Domination": ["capture_factor", "capture_time_factor"], "Kill Confirm": ["beacon_factor"],
    "Bounty Hunter": ["bounty_factor"], "Flag Strike": ["flag_capture_factor"], "Flag Heist": ["flag_capture_factor"],
    "Payload": ["payload_capture_factor", "payload_time_factor"], "Sentry Takedown": ["sentry_takedown_factor"]};
  const used = (f, k) => ["kill_factor", "assist_kill_factor", "death_factor"].includes(k) || !USED[f.Comment] || USED[f.Comment].includes(k);
  app.innerHTML = `<h1>점수·MVP</h1>
  <div class="grid g-2">
    <section class="panel"><h3>MVP는 누가 받나</h3><p class="small"><b>이긴 팀에서 점수 1등</b>이 MVP, <b>진 팀에서 점수 1등</b>이 SVP입니다. 지면 점수가 아무리 높아도 MVP는 받을 수 없습니다.</p><p class="small muted" style="margin:0">실제 경기 결과 9판에서 모두 이 규칙과 일치(관찰).</p></section>
    <section class="panel"><h3>점수는 어떻게 쌓이나</h3><p class="small">처치·도움·점령 등은 아래 표의 계수만큼, 사망은 그만큼 깎이고, 받은 <b>메달의 보너스 점수</b>가 더해집니다. 피해량도 점수가 되는데, 같은 피해라도 <b>상대 체력이 낮을수록(저레벨 판) 점수가 큽니다</b>.</p><p class="small muted" style="margin:0">관찰: 저레벨 봇 판은 피해 1,000당 약 20점, 20레벨 판은 약 7~8점. 그래서 고레벨일수록 처치·도움 비중이 커집니다(추정).</p></section>
  </div>
  <h2>모드별 점수 계수</h2>
  <div class="panel scroll"><table class="tbl nw"><tr><th>모드</th>${COLS.filter(([k]) => F.some(f => f[k])).map(([, n]) => `<th class="n">${n}</th>`).join("")}</tr>${F.map(f => `<tr><td><b>${esc(modeName(f.Comment))}</b></td>${COLS.filter(([k]) => F.some(x => x[k])).map(([k]) => used(f, k) ? `<td class="n"><b>${f[k] ? num(f[k]) : "–"}</b></td>` : `<td class="n unused" title="이 모드에는 해당 목표물이 없어 쓰이지 않는 값">${f[k] ? num(f[k]) : "–"}</td>`).join("")}</tr>`).join("")}</table></div>
  <p class="small muted">게임 데이터(전투 점수 계수표) 그대로입니다. 처치 점수는 ${esc(modeName("Free-for-All"))} 60 · ${esc(modeName("TDM"))} 50 · 나머지 30. <span class="unused">흐린 숫자</span>는 그 모드에 해당 목표물(점령 지점·화물·깃발 등)이 없어 실제로는 받을 수 없는 값으로, 데이터에 기본값만 채워져 있는 것입니다(추정).</p>
  <h2>보너스 점수가 큰 메달 <span class="small muted">${medals.length}개</span></h2>
  <div class="panel scroll"><table class="tbl" id="smed"></table></div>
  <button type="button" class="btn ghost morebtn" id="smore" hidden></button>`;
  // 메달 표는 20개씩 보인다
  let shown = 20;
  const drawMedals = () => {
    $("#smed").innerHTML = `<tr><th class="nw">메달</th><th class="n nw">보너스</th><th>조건</th></tr>${medals.slice(0, shown).map(m => `<tr><td><div class="mcell">${m.icon ? `<img class="cell" src="img/${encodeURIComponent(m.icon)}.webp" alt="" loading="lazy">` : ""}<b>${L(m.name) || "–"}</b></div></td><td class="n nw">+${num(m.score)}</td><td class="small">${L(m.desc) || ""}</td></tr>`).join("")}`;
    $("#smore").hidden = medals.length <= shown; $("#smore").textContent = `더 보기 (남은 ${Math.max(0, medals.length - shown)}개)`;
  };
  $("#smore").addEventListener("click", () => { shown += 20; drawMedals(); });
  drawMedals();
}

// ---------- 통합 검색 ----------
function find(q0 = "") {
  app.innerHTML = `<h1>검색</h1>
  <div class="filters"><input type="search" id="fq" placeholder="탱크·부품·칩·스킨·오퍼레이터·모드·메달 이름이나 설명" aria-label="통합 검색" value="${esc(q0)}" autofocus><span class="count" id="fcnt"></span></div><div id="fres"></div>`;
  const pool = [];
  D.tanks.forEach(t => pool.push({k: "탱크", n: strip(tname(t)), d: [t.model, strip(t.name?.en), strip(L(t.skill.name)), strip(L(t.trait.name))].join(" · "), h: "#t/" + t.id}));
  const seen = new Set();
  Object.values(D.parts).forEach(p => { const n = strip(L(p.name)); if (!n) return; const d = strip(L(p.desc)); const key = n + "|" + d; if (seen.has(key)) return; seen.add(key);
    const owner = D.tanks.find(t => t.slots.some(sl => sl.includes(p.id))); pool.push({k: "부품", n, d, h: owner ? "#t/" + owner.id : "#parts"}); });
  Object.values(D.chips).forEach(c => { const n = strip(L(c.name)); if (n) pool.push({k: "칩", n, d: strip(L(c.desc)), h: "#chips/" + c.id}); });
  Object.values(D.skins).forEach(s => { const n = strip(L(s.name)); if (n) pool.push({k: "스킨", n, d: s.tank && TANK[s.tank] ? strip(tname(TANK[s.tank])) : "", h: s.tank && TANK[s.tank] ? "#t/" + s.tank : "#skins"}); });
  D.operators.forEach(o => pool.push({k: "오퍼레이터", n: strip(L(o.name)), d: strip(L(o.skill?.desc)), h: "#operators"}));
  D.modes.forEach(m => { const n = strip(L(m.name)); if (n) pool.push({k: "모드", n, d: "", h: "#modes"}); });
  (D.medals || []).forEach(m => { const n = strip(L(m.name)); if (n) pool.push({k: "메달", n, d: strip(L(m.desc)), h: "#growth"}); });
  GLOSS.forEach(([k]) => pool.push({k: "용어", n: k, d: glossText(k), h: "#glossary"}));
  // 빈 화면에 보일 예시 검색어: 데이터에 실제로 있는 이름에서 고른다(탱크·부품·칩·용어 하나씩)
  const top = D.tanks.filter(t => t.status === "released").sort((a, b) => b.rarity - a.rarity)[0];
  const gear = Object.values(D.parts).find(p => /LOC_Gear/i.test(p.key || "") && named(p.name));
  const chip = Object.values(D.chips).find(c => named(c.name));
  const EX = [top && strip(tname(top)), gear && strip(L(gear.name)), chip && strip(L(chip.name)), "치명타"].filter(Boolean);
  const draw = () => {
    const q = $("#fq").value.trim().toLowerCase();
    if (q.length < 1) { $("#fres").innerHTML = `<p class="muted">찾을 말을 입력하세요. 이렇게 찾아볼 수 있습니다:</p><div class="row">${EX.map(x => `<button type="button" class="pill" data-ex="${esc(x)}" style="cursor:pointer;background:none;padding:4px 12px">${esc(x)}</button>`).join("")}</div>`; $("#fcnt").textContent = ""; return; }
    const hit = pool.filter(x => (x.n + " " + x.d).toLowerCase().includes(q)).sort((a, b) => (b.n.toLowerCase().includes(q)) - (a.n.toLowerCase().includes(q)));
    $("#fcnt").textContent = hit.length + "개";
    $("#fres").innerHTML = `<div class="hits">${hit.slice(0, 150).map(x => `<a class="hit" href="${x.h}"><span class="k">${x.k}</span><span class="b"><b>${esc(x.n)}</b>${x.d ? `<br><span class="small muted">${esc(x.d.slice(0, 140))}</span>` : ""}</span></a>`).join("")}</div>${hit.length > 150 ? `<p class="small muted">앞 150개만 보여 줍니다. 더 자세히 입력하세요.</p>` : ""}`;
    if (!hit.length) $("#fres").innerHTML = '<div class="empty">결과 없음</div>';
  };
  $("#fq").addEventListener("input", draw);
  $("#fres").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (!b) return; $("#fq").value = b.dataset.ex; draw(); });
  draw();
}

render();
</script>
</body>
</html>
